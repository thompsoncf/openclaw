<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaq · Clínica (protótipo)</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0A0F0C;--bg-2:#0E1512;--surface:#121A16;--line:#1E2A23;
  --text:#EAF2ED;--text-dim:#8FA197;--text-faint:#5E6F66;
  --neon:#25D366;--neon-bright:#46F58A;--neon-deep:#0FA85A;
  --neon-fraco:rgba(37,211,102,.10);--neon-borda:#1E4A3A;--neon-fundo:#10241A;
  --sobre-verde:#04150C;
  --ambar:#E0A32E;--coral:#E0574F;--azul:#229ED9;--roxo:#C9A3E0;
  --ambar-borda:#5A4520;--ambar-fundo:#241C0F;--coral-borda:#5A2B2B;--coral-fundo:#241313;
  --azul-borda:#1B3A4A;--azul-fundo:#0D1B23;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pag:1180px;
  --faixa:34px; /* altura fixa da faixa do protótipo: menu, main, gaveta e modal começam abaixo dela */
  --card:var(--surface);--card-2:var(--bg-2);--borda:var(--line);--txt:var(--text);--txt-mut:var(--text-dim);--verde:var(--neon);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px}
h1,h2,h3,h4,.logo{font-family:var(--display);letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- faixa do protótipo: sempre UMA linha, altura --faixa ---------- */
.proto{position:fixed;top:0;left:0;right:0;height:var(--faixa);z-index:90;background:#241C0F;border-bottom:1px solid var(--ambar-borda);color:#F4D29A;font-size:.74rem;padding:0 .8rem;display:flex;gap:.5rem;align-items:center;white-space:nowrap}
.proto b{color:#FFE7B8}
.proto .pf-tit{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.proto .pf-ctl{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex:0 0 auto}
.proto button{background:#3A2C12;border:1px solid var(--ambar-borda);color:#F4D29A;border-radius:99px;padding:.12rem .6rem;font-size:.7rem;line-height:1.45}
.proto button.on{background:var(--ambar);border-color:var(--ambar);color:#1d1406;font-weight:700}
.proto .pf-seg{display:inline-flex;border:1px solid var(--ambar-borda);border-radius:99px;overflow:hidden;background:#3A2C12}
.proto .pf-seg button{border:0;border-radius:0;background:none}
.proto .pf-seg button.on{background:var(--ambar);color:#1d1406}
.pf-curto{display:none}
.demo-pan{display:none;position:fixed;top:calc(var(--faixa) + 4px);right:8px;z-index:94;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - var(--faixa) - 16px);overflow-y:auto;background:var(--card);border:1px solid var(--ambar-borda);border-radius:12px;padding:.45rem;box-shadow:0 14px 36px rgba(0,0,0,.55)}
.demo-pan.on{display:block}
.demo-pan .dp-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#F4D29A;padding:.3rem .45rem .4rem}
.demo-pan .dp-i{display:grid;grid-template-columns:24px 1fr;gap:.55rem;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:8px;color:var(--txt);padding:.42rem .45rem;font-size:.84rem}
.demo-pan .dp-i:hover{background:var(--card-2)}
.demo-pan .dp-i.on{background:var(--ambar-fundo)}
.demo-pan .dp-i small{display:block;color:var(--txt-mut);font-size:.72rem;margin-top:1px}
.demo-pan .dp-n{width:22px;height:22px;border-radius:50%;border:1px solid var(--ambar-borda);color:#F4D29A;font-family:var(--mono);font-size:.7rem;display:flex;align-items:center;justify-content:center}
.demo-pan .dp-pe{border-top:1px solid var(--borda);margin-top:.35rem;padding:.5rem .45rem .2rem;font-size:.72rem;color:var(--txt-mut);line-height:1.45}
/* modo apresentação: some tudo que é nota de desenvolvedor */
body.apresenta .dev{display:none!important}

/* ---------- menu lateral (cópia do painel) ---------- */
.side{position:fixed;left:0;top:var(--faixa);bottom:0;width:216px;background:var(--card);border-right:1px solid var(--borda);padding:1rem .7rem;overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.side-logo{font-weight:600;color:var(--txt);font-size:1.1rem;padding:.2rem .6rem .3rem;display:flex;align-items:center;gap:.5rem;font-family:var(--display)}
.side-conta{font-size:.72rem;color:var(--txt-mut);padding:0 .6rem .7rem;line-height:1.3}
.side-grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:#6a6a66;padding:.7rem .6rem .25rem}
button.side-grp{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;text-align:left;font-family:inherit;border-radius:6px}
button.side-grp:hover{color:var(--txt-mut)}
.nav-i{display:flex;align-items:center;gap:.65rem;padding:.5rem .6rem;border-radius:8px;color:var(--txt-mut);text-decoration:none;font-size:.88rem;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav-i:hover{background:var(--card-2);color:var(--txt)}
.nav-i.on{background:rgba(29,158,117,.16);color:var(--neon)}
.nav-ic{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-i>span:nth-child(2){flex:1;min-width:0}
.nav-i .novo{margin-left:auto;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--sobre-verde);background:var(--neon);border-radius:99px;padding:1px 6px}
.nav-i .nvb{margin-left:auto;background:var(--neon);color:var(--sobre-verde);border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:.7rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.nav-i .nvb.amb{background:var(--ambar)}

/* ---------- área ---------- */
main{padding:calc(var(--faixa) + 16px) 22px 60px 238px;max-width:calc(var(--pag) + 260px)}
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1rem}
.pg-h h1{font-size:1.45rem;font-weight:600;margin:0}
.pg-h .sub{color:var(--txt-mut);font-size:.84rem;margin-top:.15rem}
.btn{display:inline-flex;align-items:center;gap:.35rem;background:var(--neon);color:var(--sobre-verde);border:0;border-radius:8px;padding:.5rem .85rem;font-weight:600;font-size:.84rem;min-height:36px}
.btn:hover{background:var(--neon-bright)}
.btn.sec{background:var(--card-2);color:var(--txt);border:1px solid var(--borda);font-weight:500}
.btn.sec:hover{border-color:var(--neon-borda)}
.btn.min{padding:.28rem .6rem;min-height:28px;font-size:.76rem}
.btn.coral{background:var(--coral-fundo);color:#F5B3AE;border:1px solid var(--coral-borda)}
.btn.amb{background:var(--ambar-fundo);color:#F4D29A;border:1px solid var(--ambar-borda)}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--borda);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--txt-mut);padding:.3rem .7rem;border-radius:7px;font-size:.8rem}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 0 0 1px var(--borda)}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.9rem}
.card h3{margin:0 0 .6rem;font-size:1rem;font-weight:600}
.mut{color:var(--txt-mut)}
.faint{color:var(--text-faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.grid2>*,.grid3>*{min-width:0} /* coluna de grade não cresce além da tela por causa de texto que não quebra */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:.9rem}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:.7rem .85rem;min-width:0}
/* atalho que rola até um título: o título para abaixo da faixa fixa do protótipo (:where não pesa, as regras próprias vencem) */
:where(main [id]){scroll-margin-top:calc(var(--faixa) + 12px)}
.kpi b{display:block;font-size:1.45rem;font-family:var(--display);font-weight:600}
.kpi span{font-size:.74rem;color:var(--txt-mut)}
.kpi.ruim b{color:var(--coral)}.kpi.ok b{color:var(--neon)}.kpi.amb b{color:var(--ambar)}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;border-radius:99px;padding:1px 8px;border:1px solid var(--borda);color:var(--txt-mut);background:var(--card-2);white-space:nowrap}
.chip.g{border-color:var(--neon-borda);color:var(--neon);background:var(--neon-fundo)}
.chip.a{border-color:var(--ambar-borda);color:var(--ambar);background:var(--ambar-fundo)}
.chip.r{border-color:var(--coral-borda);color:#F08A83;background:var(--coral-fundo)}
.chip.b{border-color:var(--azul-borda);color:#6CC4F0;background:var(--azul-fundo)}
.tb{width:100%;border-collapse:collapse;font-size:.84rem}
.tb th{text-align:left;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-mut);font-weight:600;padding:.45rem .55rem;border-bottom:1px solid var(--borda)}
.tb td{padding:.55rem .55rem;border-bottom:1px solid var(--borda);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb td.r{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--borda);margin-bottom:.9rem;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--txt-mut);padding:.5rem .75rem;font-size:.86rem;margin-bottom:-1px}
.tabs button.on{color:var(--txt);border-bottom-color:var(--neon)}
.bar{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden;border:1px solid var(--borda)}
.bar i{display:block;height:100%;background:var(--neon);transition:width .5s}
.bar i.a{background:var(--ambar)}.bar i.r{background:var(--coral)}
.field{margin-bottom:.6rem}
.field label{display:block;font-size:.72rem;color:var(--txt-mut);margin-bottom:.2rem}
.inp{width:100%;background:var(--bg);border:1px solid #2a3a31;border-radius:8px;padding:.5rem .65rem;color:var(--txt);font-size:.88rem;min-height:38px}
.opts{display:flex;flex-wrap:wrap;gap:.3rem}
.opt{background:var(--bg);border:1.5px solid #2a3a31;color:var(--txt-mut);border-radius:99px;padding:.22rem .7rem;font-size:.78rem}
.opt.on{border-color:var(--neon-borda);color:var(--neon);background:var(--neon-fundo)}
.hint{background:var(--card-2);border:1px dashed var(--borda);border-radius:10px;padding:.55rem .7rem;font-size:.78rem;color:var(--txt-mut);margin-top:.6rem}
.hint b{color:var(--txt)}

/* ---------- agenda ---------- */
.ag-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.ag-top .dia{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:0 .4rem}
.ag-leg{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.72rem;color:var(--txt-mut);margin:.2rem 0 .7rem}
/* a moldura (borda, canto, fundo) fica no .ag-rolo, que rola na horizontal;
   o .ag não corta nada (sem overflow:hidden), então a semana rola dentro dele */
.ag-rolo{overflow-x:auto;border:1px solid var(--borda);border-radius:12px;background:var(--card-2);-webkit-overflow-scrolling:touch}
.ag{display:grid;grid-template-columns:56px repeat(3,minmax(180px,1fr));min-width:min-content}
.ag .h{background:var(--card);padding:.5rem .6rem;border-left:1px solid var(--borda);border-bottom:1px solid var(--borda);font-weight:600;font-size:.84rem}
.ag-abas{display:none}
.ag-abas button{flex:1 1 0;min-width:0;background:var(--card-2);border:1px solid var(--borda);border-radius:10px;color:var(--txt-mut);padding:.4rem .5rem;font-size:.8rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-abas button.on{border-color:var(--neon-borda);background:var(--neon-fundo);color:var(--txt);font-weight:600}
.ag-abas small{display:block;font-size:.66rem;color:var(--txt-mut);font-weight:400}
.ag .h small{display:block;font-weight:400;color:var(--txt-mut);font-size:.7rem}
.ag .h .oc{float:right;font-family:var(--mono);font-size:.72rem;color:var(--neon)}
.ag .hr{font-family:var(--mono);font-size:.68rem;color:var(--text-faint);padding:.25rem .4rem;border-bottom:1px solid #16201b;height:44px}
.ag .c{border-left:1px solid var(--borda);border-bottom:1px solid #16201b;height:44px;padding:3px 5px;position:relative}
.ag .c.off{background:repeating-linear-gradient(45deg,#0c120f,#0c120f 6px,#0A0F0C 6px,#0A0F0C 12px)}
.ag .c.livre{cursor:pointer}
.ag .c.livre:hover{background:var(--neon-fundo)}
.ag .c.livre:hover::after{content:"+ agendar";position:absolute;left:8px;top:12px;font-size:.7rem;color:var(--neon)}
.ev{position:absolute;left:5px;right:5px;top:3px;border-radius:8px;padding:4px 7px;font-size:.72rem;line-height:1.25;overflow:hidden;border-left:3px solid;cursor:pointer;z-index:1}
.ev b{display:block;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t{color:var(--txt-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev:hover{filter:brightness(1.15)}
.s-agendado{background:#16211c;border-color:#8FA197}
.s-confirmado{background:#10241A;border-color:#25D366}
.s-presente{background:#0D1B23;border-color:#229ED9}
.s-atendimento{background:#241C0F;border-color:#E0A32E}
.s-finalizado{background:#121614;border-color:#3a4a41;color:#7d8c84}
.s-faltou{background:#241313;border-color:#E0574F}
.s-cancelou{background:#1a1414;border-color:#5A2B2B;color:#a07a77;text-decoration:line-through}
.s-segurado{background:repeating-linear-gradient(135deg,#10241A,#10241A 6px,#0E1512 6px,#0E1512 12px);border-color:#46F58A;border-style:dashed}
/* aguardando sinal por Pix: reservado, conta como ocupado, mas cai se o Pix não vier até o prazo */
.s-sinal{background:repeating-linear-gradient(135deg,#1E1628,#1E1628 6px,#0E1512 6px,#0E1512 12px);border-color:#C9A3E0;border-style:dashed}
/* uma agenda só com o Amigo: selo de leitura, quem marcou cada atendimento e o que vem de lá */
.selo-am{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;border:1px solid #2B4A7A;color:#8AB4F8;background:#0D1623;border-radius:99px;padding:1px 9px;white-space:nowrap;cursor:default}
.via{display:inline-block;font-size:.58rem;font-weight:600;font-style:normal;line-height:1.35;border:1px solid;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.via.am{border-color:#2B4A7A;color:#8AB4F8}
.via.ag{border-color:var(--neon-borda);color:var(--neon)}
.via.rc{border-color:#2a3a31;color:var(--txt-mut)}
.ev .via{margin:0 4px 0 0}
.ag-nota{font-size:.74rem;color:var(--txt-mut);margin-top:.4rem;line-height:1.45}
.ag-sim{border:1px dashed #2B4A7A;border-radius:10px;padding:.5rem .6rem;margin-top:.6rem;background:#0D1623}
.ag-sim .ag-nota{color:#9CC0F5;margin:0 0 .1rem}
.ag-sim .acoes{margin-top:.4rem}

/* ---------- gaveta ---------- */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none}
.veu.on{display:block}
.gav{position:fixed;top:var(--faixa);right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--borda);z-index:81;transform:translateX(100%);transition:transform .22s;overflow-y:auto;padding:1rem 1.1rem 2rem}
.gav.on{transform:none}
/* ✕ da gaveta e do modal: fica grudado no topo ao rolar, com área de toque de 38px */
.gav .fechar,.modal .fechar{position:sticky;top:0;float:right;z-index:3;width:38px;height:38px;margin:-.4rem -.5rem .3rem .6rem;border-radius:50%;background:var(--card-2);border:1px solid var(--borda);color:var(--txt);font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
.gav .fechar:hover,.modal .fechar:hover{border-color:var(--neon-borda)}
.gav h2{font-size:1.15rem;margin:.1rem 0 .15rem}
.gav .sec:not(.btn){border-top:1px solid var(--borda);margin-top:.8rem;padding-top:.8rem} /* :not(.btn): o botão .btn.sec dentro da gaveta não herda a borda de seção */
.gav .sec h4{margin:0 0 .45rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-mut);font-family:var(--body);font-weight:600}
.linha{display:flex;justify-content:space-between;gap:.6rem;font-size:.84rem;padding:.2rem 0}
.linha span:first-child{color:var(--txt-mut)}
.passos{display:flex;gap:4px;margin:.5rem 0 .2rem;flex-wrap:wrap}
.passos i{font-style:normal;font-size:.66rem;padding:2px 7px;border-radius:99px;border:1px solid var(--borda);color:var(--text-faint)}
.passos i.feito{color:var(--neon);border-color:var(--neon-borda);background:var(--neon-fundo)}
.passos i.agora{color:var(--sobre-verde);background:var(--neon);border-color:var(--neon);font-weight:700}
.acoes{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.ses{display:flex;gap:5px;flex-wrap:wrap;margin:.3rem 0}
.ses i{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--borda);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-style:normal;color:var(--text-faint)}
.ses i.ok{background:var(--neon-fundo);border-color:var(--neon-borda);color:var(--neon)}
.ses i.nx{border-color:var(--ambar);color:var(--ambar)}

/* ---------- funil (cópia do kanban de Prospecção) ---------- */
.kbrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:.6rem;overflow-x:auto;padding-bottom:.4rem}
.kbcol{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--borda);border-radius:14px;padding:.7rem;min-height:300px}
.kbcol h4{margin:0 0 .55rem;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;font-family:var(--body);font-weight:600}
.kbcnt{background:var(--card-2);border:1px solid var(--borda);border-radius:999px;padding:.02rem .5rem;font-size:.72rem;color:var(--txt-mut)}
.kbdrop{display:flex;flex-direction:column;gap:.5rem}
.kbcard{background:var(--card);border:1px solid var(--borda);border-radius:11px;padding:.6rem .65rem;cursor:pointer;transition:border-color .15s}
.kbcard:hover{border-color:var(--neon)}
.kbcard .emp{font-size:.88rem;font-weight:600}
.kbcard .sub{color:var(--txt-mut);font-size:.74rem;margin-top:.22rem}
.kbcard .ft{display:flex;gap:.3rem;margin-top:.42rem;flex-wrap:wrap}
.kbcol.agenda{border-color:var(--neon-borda)}
.kbcol.agenda h4::after{content:"= agenda";font-size:.62rem;color:var(--neon);font-weight:500;margin-left:auto;margin-right:.4rem}

/* ---------- roteiro ---------- */
.rt-kpi{text-align:left;color:var(--txt);font:inherit;cursor:pointer;width:100%}
.rt-kpi:hover,.rt-kpi.on{border-color:var(--neon-borda)}
.rt-kpi.on{background:var(--neon-fundo)}
.rt-aviso{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--coral-fundo);border:1px solid var(--coral-borda);color:#F5B3AE;border-radius:10px;padding:.5rem .7rem;font-size:.84rem;margin-bottom:.4rem}
.rt-aviso b{color:#FFD2CE}
.rt-mes{margin:.7rem 0 .35rem -1.55rem;font-size:.64rem;letter-spacing:.14em;color:var(--txt-mut);font-weight:700}
.rt-ant{margin:-.2rem 0 .3rem}
.tl .it.r::before{border-color:var(--coral);background:var(--coral-fundo)}
.rt-v{background:var(--card-2);border:1px solid var(--borda);border-radius:10px;padding:.5rem .65rem;cursor:pointer}
.rt-v:hover{border-color:var(--neon-borda)}
.rt-v.g{border-color:var(--neon-borda)}.rt-v.a{border-color:var(--ambar-borda)}.rt-v.r{border-color:var(--coral-borda);background:var(--coral-fundo)}

.rt-fc.g{border-color:var(--neon-borda);background:var(--neon-fundo)}.rt-fc.a{border-color:var(--ambar-borda);background:var(--ambar-fundo)}
.rt-fc.r{border-color:var(--coral-borda);background:var(--coral-fundo)}.rt-fc.sug{border-style:dashed;border-color:var(--neon-borda);background:transparent}
.rt-fc.vazio{color:var(--text-faint);background:transparent}.rt-fc.x{opacity:.5;text-decoration:line-through}.rt-fc.pas{opacity:.55}
.rt-ref{background:var(--card-2);border:1px solid var(--borda);border-radius:10px;padding:.55rem .7rem;font-size:.8rem;line-height:1.55;color:var(--txt-mut);margin-bottom:.6rem}

.rt-cid{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:.7rem .8rem;cursor:pointer;min-width:0}

.rt-cid .l1{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.rt-cid .nm{font-weight:600;font-size:1rem;font-family:var(--display)}

.rt-cid .l3 small{display:block;font-size:.72rem;color:var(--txt-mut);margin-top:.1rem}
.rt-cid .l4{font-size:.74rem;color:var(--txt-mut);margin-top:.35rem;line-height:1.45}
.rt-cid .big{font-family:var(--display);font-weight:600;font-size:1.15rem}

.rt-hl{color:var(--neon);font-weight:700}
.rt-selo{font-size:.62rem;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:1px 6px;border:1px solid;white-space:nowrap;font-family:var(--body)}
.rt-selo.vale{color:var(--neon);border-color:var(--neon-borda);background:var(--neon-fundo)}
.rt-selo.ja{color:#6CC4F0;border-color:var(--azul-borda);background:var(--azul-fundo)}
.rt-selo.ainda{color:var(--ambar);border-color:var(--ambar-borda);background:var(--ambar-fundo)}
.rt-selo.nao{color:#F08A83;border-color:var(--coral-borda);background:var(--coral-fundo)}
.rt-org{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--card-2);margin:.4rem 0 .1rem}
.rt-org i{display:block;height:100%}
.rt-sem{font-size:.76rem;color:var(--text-faint);border:1px dashed var(--borda);border-radius:9px;padding:.4rem .6rem;margin-top:.6rem}
.rt-como{margin-top:1rem}
.rt-como summary{cursor:pointer;font-size:.95rem;list-style:none}

.rt-como[open] summary{margin-bottom:.7rem}
.rt-como-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.rt-como-g>div{background:var(--card-2);border:1px solid var(--borda);border-radius:10px;padding:.55rem .6rem;font-size:.78rem;color:var(--txt-mut);line-height:1.5}
.rt-como-g b{color:var(--txt)}
.rt-p{display:flex;gap:.5rem;align-items:center;padding:.4rem 0;border-top:1px solid var(--borda);font-size:.82rem}
.rt-p small{display:block;color:var(--txt-mut);font-size:.72rem;line-height:1.35}
.rt-custo{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:.5rem;align-items:center;font-size:.8rem;color:var(--txt-mut);margin:.25rem 0}
.rt-custo .inp{min-height:32px;padding:.3rem .5rem;text-align:right}
.rt-bl{border:1px solid var(--borda);border-radius:12px;padding:.7rem .8rem;margin-top:.8rem;background:var(--card-2)}
.rt-bl h4{margin:0 0 .55rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-mut);font-family:var(--body);font-weight:600}
.rt-bl .linha span:last-child{text-align:right}
.rt-ck{display:grid;grid-template-columns:24px minmax(0,1fr);gap:.5rem;padding:.5rem 0;border-top:1px solid var(--borda);font-size:.84rem}
.rt-ck .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;border:1px solid var(--ambar-borda);color:var(--ambar);background:var(--ambar-fundo)}
.rt-ck .ic.ok{border-color:var(--neon-borda);color:var(--neon);background:var(--neon-fundo)}
.rt-opt{text-align:left;border-radius:10px;line-height:1.3;padding:.3rem .6rem}
.rt-opt small{display:block;font-size:.68rem;color:var(--txt-mut);font-weight:400}
.opt.rt-nao{opacity:.55;text-decoration:line-through}
.rt-pergunta{background:var(--ambar-fundo);border:1px solid var(--ambar-borda);border-radius:9px;padding:.5rem .6rem;font-size:.8rem;color:#F4D29A;margin-top:.5rem}
.rt-regras{font-size:.78rem;color:var(--txt-mut);line-height:1.6;background:var(--bg);border:1px solid var(--borda);border-radius:9px;padding:.5rem .6rem;margin-top:.4rem}
.rt-regras b{color:var(--txt)}
.rt-rod{font-size:.8rem;color:var(--txt-mut);line-height:1.5;margin-bottom:.35rem}
.rt-rod b{color:var(--txt)}
.rt-pe{position:sticky;bottom:0;z-index:2;margin:1rem -1.1rem -2rem;padding:.65rem 1.1rem .9rem;background:var(--card);border-top:1px solid var(--neon-borda);box-shadow:0 -10px 24px rgba(0,0,0,.35)}
.rt-pe-n{display:flex;gap:.3rem .8rem;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--txt-mut)}
.rt-pe-n b{color:var(--txt);font-family:var(--mono)}
.rt-sub{display:block;font-size:.72rem;color:var(--text-faint)}
.rt-falta{font-size:.74rem;color:var(--ambar);margin-top:.35rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.gav.larga{width:min(640px,100%)}
.rt-sobra{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem;background:var(--neon-fundo);border:1px solid var(--neon-borda);border-radius:12px;padding:.6rem .8rem;margin-bottom:.7rem}
.rt-sobra b{font-family:var(--display);font-size:1.9rem;font-weight:600;color:var(--neon);line-height:1}
.rt-sobra>span:not(.fonte):not(.mut){font-size:.82rem;color:var(--txt)}
.rt-fech{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1rem}
.rt-fech h4{margin:0 0 .4rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-mut);font-weight:600}
.rt-fr{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.35rem 0;border-top:1px solid var(--borda);font-size:.8rem}
.rt-fr small{display:block;color:var(--txt-mut);font-size:.7rem}
.rt-fr .seg button{padding:.2rem .5rem;font-size:.72rem}
.modal:has(.rt-fech){width:min(820px,94vw)}
.fonte.amigo.ex{color:#8AB4F8;border-color:#2B4A7A}
.fonte.zap.ex{color:var(--neon);border-color:var(--neon-borda)}
@media (max-width:900px){
  .rt-cids,.rt-fech{grid-template-columns:1fr}
  .rt-como-g{grid-template-columns:1fr 1fr}
  .rt-so-pc{display:none}
  .gav.larga{width:100%}
  .rt-dia .vagas{grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem}
  .rt-dia .vg{padding:.3rem .35rem}
}
@media (max-width:480px){.rt-como-g{grid-template-columns:1fr}}
.vagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.4rem}
.vg{background:var(--bg);border:1.5px solid #2a3a31;border-radius:9px;padding:.4rem .5rem;font-size:.78rem;transition:all .3s}
.vg b{font-family:var(--mono);display:block}
.vg small{color:var(--txt-mut);font-size:.66rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg.cheia{border-color:var(--neon-borda);background:var(--neon-fundo)}
.vg.cheia small{color:var(--neon)}
.vg.resp{border-color:var(--ambar-borda);background:var(--ambar-fundo)}
.vg.resp small{color:var(--ambar)}
button.vg{font:inherit;color:var(--txt);text-align:left;width:100%;cursor:pointer;min-width:0}
.vg.conv{border-color:var(--azul-borda);background:var(--azul-fundo);border-style:dashed}
.vg.conv small{color:#6CC4F0}
.vg.segu{background:repeating-linear-gradient(135deg,#10241A,#10241A 6px,#0E1512 6px,#0E1512 12px);border-color:#46F58A;border-style:dashed}
.vg.segu small{color:var(--neon-bright)}
.vg.ok{border-color:var(--neon-borda);background:var(--neon-fundo)}
.vg.ok small{color:var(--neon)}
.rank{display:flex;align-items:center;gap:.6rem;background:var(--card-2);border:1px solid var(--borda);border-radius:9px;padding:.45rem .6rem;margin-bottom:.35rem;font-size:.82rem}
.rank .p{width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--txt-mut)}
.rank .n{flex:1}
.rank .n small{display:block;color:var(--txt-mut);font-size:.72rem}
.rank .q{font-family:var(--mono);font-weight:700;color:var(--neon)}

/* ---------- whatsapp ---------- */
.zap{background:#0b141a;border:1px solid #1f2c33;border-radius:12px;padding:.7rem;max-width:420px}
.zap .b{background:#202c33;color:#e9edef;border-radius:8px;padding:.45rem .6rem;margin:0 2.2rem .45rem 0;font-size:.82rem;line-height:1.45}
.zap .b.eu{background:#005c4b;margin:0 0 .45rem 2.2rem}
.zap .b .h{font-size:.64rem;color:#8696a0;text-align:right;margin-top:2px}
.zap .sis{text-align:center;font-size:.68rem;color:#8696a0;background:#182229;border-radius:6px;padding:.15rem .5rem;margin:.2rem auto .5rem;width:max-content;max-width:100%}
.zap .card-p{background:#111b21;border:1px solid #2a3942;border-radius:8px;padding:.45rem .55rem;margin:.35rem 0;font-size:.78rem}

/* ---------- toast ---------- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:95;display:flex;flex-direction:column;gap:.4rem;max-width:360px}
.toast{background:var(--card);border:1px solid var(--neon-borda);border-left:3px solid var(--neon);border-radius:10px;padding:.6rem .75rem;font-size:.82rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:sobe .25s}
.toast.a{border-color:var(--ambar-borda);border-left-color:var(--ambar)}
.toast b{display:block;margin-bottom:.1rem}
@keyframes sobe{from{transform:translateY(10px);opacity:0}}

/* ---------- modal ---------- */
.modal{position:fixed;left:50%;top:calc(50% + var(--faixa) / 2);transform:translate(-50%,-50%) scale(.97);width:min(560px,94vw);max-height:calc(100vh - var(--faixa) - 24px);max-height:calc(100dvh - var(--faixa) - 24px);overflow-y:auto;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:1.1rem 1.2rem;z-index:82;display:none}
.modal.on{display:block;transform:translate(-50%,-50%)}
.modal h2{margin:0 0 .2rem;font-size:1.15rem}

/* barra de baixo do celular: a regra base vem ANTES da media query, senão o display:none vence */
.mobnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--borda);z-index:60;padding-bottom:env(safe-area-inset-bottom,0px)}
.mobnav button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--txt-mut);font-size:.64rem;padding:.45rem .1rem;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobnav button.on{color:var(--neon)}

@media (max-width:900px){
  .side{display:none}
  body.menu-on .side{display:flex;z-index:85;width:min(290px,86vw);box-shadow:10px 0 36px rgba(0,0,0,.55)}
  main{padding:calc(var(--faixa) + 12px) 12px calc(76px + env(safe-area-inset-bottom,0px))}
  .kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  /* campo com fonte menor que 16px faz o iPhone dar zoom ao tocar */
  .inp,select.inp,textarea.inp{font-size:16px}
  .mobnav{display:flex}
  /* faixa: só ícone + controles curtos; o roteiro abre num painel */
  .proto{padding:0 .5rem;gap:.35rem}
  .proto .pf-ctl{gap:.3rem}
  .pf-longo,.pf-prox{display:none}
  .pf-curto{display:inline}
  /* gaveta deixa uma faixa do véu à esquerda para fechar tocando fora */
  .gav{width:calc(100% - 36px)}
  .toasts{left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:none}
  /* agenda do dia: um profissional por vez, escolhido nas abas */
  .ag-abas{display:flex;gap:.35rem;margin-bottom:.6rem}
  .ag.ag-dia{grid-template-columns:48px minmax(0,1fr)!important}
  .ag.ag-dia .fora-mob{display:none}
  /* tabela larga rola dentro dela mesma, não a página */
  .tb{display:block;overflow-x:auto;max-width:100%}
}
@media (max-width:420px){.pf-curto.pf-sem-texto{display:none}}

/* ---------- ficha do paciente ---------- */
.pc-top{display:grid;grid-template-columns:64px 1fr auto;gap:1rem;align-items:center;margin-bottom:.8rem}
.av-g{width:64px;height:64px;border-radius:50%;background:var(--neon-fundo);border:2px solid var(--neon-borda);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.35rem;color:var(--neon);font-weight:700}
.pc-top h1{font-size:1.45rem;font-weight:600;margin:0}
.pc-top .acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.sync{font-size:.72rem;color:var(--text-faint);margin:.1rem 0 .8rem}
.alertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem;margin-bottom:.9rem}
.al{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:.55rem .7rem;font-size:.78rem;display:flex;gap:.55rem;align-items:flex-start;color:var(--txt-mut)}
.al .ic{font-size:1rem;line-height:1.2}
.al b{display:block;font-size:.84rem;color:var(--txt);font-weight:600}
.al.a{border-color:var(--ambar-borda)} .al.g{border-color:var(--neon-borda)} .al.b{border-color:var(--azul-borda)}
.tl{position:relative;border-left:2px solid var(--borda);margin-left:.5rem;padding-left:1rem}
.tl .it{position:relative;padding:.3rem 0 .6rem .2rem;font-size:.84rem}
.tl .it::before{content:"";position:absolute;left:-1.42rem;top:.55rem;width:11px;height:11px;border-radius:50%;background:var(--card);border:2px solid #2a3a31}
.tl .it.g::before{border-color:var(--neon);background:var(--neon-fundo)}
.tl .it.a::before{border-color:var(--ambar);background:var(--ambar-fundo)}
.tl .it.fut{opacity:.62}
.tl .it.fut::before{border-style:dashed}
.tl .hoje{margin:.2rem 0 .6rem -1.55rem;font-size:.64rem;letter-spacing:.14em;color:var(--neon);font-weight:700}
.tl .quando{font-family:var(--mono);font-size:.7rem;color:var(--text-faint);display:block}
.fonte{font-size:.6rem;border-radius:4px;padding:0 5px;border:1px solid var(--borda);color:var(--txt-mut);margin-left:.35rem;vertical-align:1px;white-space:nowrap}
.fonte.amigo{border-color:#2B4A7A;color:#8AB4F8}
.fonte.zap{border-color:var(--neon-borda);color:var(--neon)}
.chk{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--borda);font-size:.84rem;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk i{font-style:normal;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--neon-borda);background:var(--neon-fundo);color:var(--neon);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;flex:0 0 auto;margin-top:1px}
.chk i.off{background:var(--bg);border-color:#2a3a31;color:transparent}
.chk small{display:block;color:var(--txt-mut);font-size:.74rem}
.nota-rec{background:var(--bg);border:1px solid #2a3a31;border-radius:8px;padding:.55rem .65rem;font-size:.84rem;min-height:56px}
.ps-row{display:grid;grid-template-columns:1.6fr .9fr 1.1fr 1.6fr .8fr;gap:.6rem;align-items:center;padding:.55rem .6rem;border-bottom:1px solid var(--borda);font-size:.84rem;cursor:pointer}
.ps-row:hover{background:var(--card-2)}
.ps-row.hd{cursor:default;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-mut);font-weight:600}
.ps-row.hd:hover{background:none}
.ps-row .nm{font-weight:600}
.ps-row .nm small{display:block;font-weight:400;color:var(--txt-mut);font-size:.72rem}
@media (max-width:900px){
  .pc-top{grid-template-columns:48px 1fr}.pc-top .acts{grid-column:1/-1;justify-content:flex-start}
  .av-g{width:48px;height:48px;font-size:1.05rem}
  .ps-row{grid-template-columns:1fr auto}.ps-row>:nth-child(2),.ps-row>:nth-child(3),.ps-row>:nth-child(4){display:none}
}

/* ---------- planos e pacotes ---------- */
.pbrd{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:.6rem;overflow-x:auto;padding-bottom:.4rem}
.pcol{background:var(--bg);border:1px solid var(--borda);border-radius:14px;padding:.65rem;min-height:200px}
.pcol h4{margin:0 0 .15rem;font-size:.84rem;font-family:var(--body);font-weight:600;display:flex;justify-content:space-between}
.pcol .tot{font-family:var(--mono);font-size:.72rem;color:var(--txt-mut);margin-bottom:.5rem}
.pcol.ok{border-color:var(--neon-borda)} .pcol.no{opacity:.8}
.pcard{background:var(--card);border:1px solid var(--borda);border-radius:11px;padding:.55rem .6rem;margin-bottom:.45rem;cursor:pointer}

.pcard .nm{font-weight:600;font-size:.86rem}
.pcard .pl{color:var(--txt-mut);font-size:.74rem;margin:.1rem 0 .3rem}
.pcard .vl{font-family:var(--mono);font-weight:700;font-size:.9rem}
.itm{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;align-items:center;background:var(--card-2);border:1px solid var(--borda);border-radius:9px;padding:.45rem .55rem;margin-bottom:.35rem;font-size:.84rem}
.itm small{display:block;color:var(--txt-mut);font-size:.72rem}
.qtd{display:inline-flex;align-items:center;border:1px solid var(--borda);border-radius:7px;overflow:hidden}
.qtd button{background:var(--bg);border:0;color:var(--txt);width:26px;height:26px}
.qtd span{min-width:26px;text-align:center;font-family:var(--mono);font-size:.8rem}
.xbt{background:none;border:0;color:var(--text-faint);font-size:1rem}
.tot-box{background:var(--bg);border:1px solid var(--borda);border-radius:10px;padding:.6rem .7rem;margin-top:.6rem}

.saude{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:900px){.itm{grid-template-columns:1fr auto}.itm .qtd{grid-column:1}}
/* a proposta impressa: folha clara na tela, e só ela na impressora */
.pr-folha{background:#fff;color:#1b1b1b;border-radius:10px;padding:1rem 1.05rem;margin-top:.2rem}
.pr-folha h2{color:#1b1b1b;margin:.6rem 0 .5rem}
.pr-cab{border-bottom:2px solid #1FA463;padding-bottom:.45rem}

function simplificar(raiz){
  if(!APRESENTA||!raiz||!document.createTreeWalker)return;
  const w=document.createTreeWalker(raiz,4 /* só texto */), ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){let t=n.nodeValue;const o=t;for(const [re,s] of SIMPLES)t=t.replace(re,s);if(t!==o)n.nodeValue=t}
}
function tipo(n){return TIPOS.find(t=>t[0]===n)||TIPOS[0]}

function gerarSemana(){
  EV.forEach(e=>{if(e.dia===undefined)e.dia=HOJE});
  const nomes=['Alice Moura','Bruno Castro','Cecília Reis','Diego Farias','Elaine Costa','Fábio Nunes','Gabriela Pinto','Hugo Martins','Iara Lopes','Jorge Batista','Kátia Mello','Leandro Sá','Mirela Dantas','Nilton Braga','Olga Freitas','Priscila Góes','Raul Mendes','Sabrina Luz','Téo Barros','Vera Campos'];
  /* sábado do Dr. Manoel é em Lago da Pedra: quem marca lá mora lá (não é quem está na fila de Lago, que ainda espera, nem gente de Pedreiras) */
  const lago=['Zilda Brandão','Edvaldo Serra','Nazaré Lobo','Joaquim Brito','Terezinha Maia','Francisco Paz','Marlene Rocha','Valdir Sousa'];
  const taxa={manoel:[.75,.8,0,.35,.6,.7],juliana:[.6,.55,0,.5,.45,0],brenda:[0,.7,0,.5,0,0]};
  let s=7, id=1000, n=0, nl=0;
  /* a mesma pessoa não fica em dois lugares ao mesmo tempo: pula o nome se ela já tem horário que se sobrepõe */
  const livre=(nm,dia,k,d)=>!EV.some(e=>e.pac===nm&&e.dia===dia&&rxVivo(e)&&(cobre(e,HORAS[k])||(d===2&&cobre(e,HORAS[k+1]))||HORAS.slice(k,k+d).includes(e.h)));
  const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(const p of PROF){
    DIAS.forEach((_,dia)=>{
      if(dia===HOJE)return;
      for(let k=0;k<HORAS.length;k++){
        const hr=HORAS[k];
        if(!atende(p.id,dia,hr))continue;
        if(EV.some(e=>e.p===p.id&&e.dia===dia&&cobre(e,hr)))continue;
        if(rnd()>taxa[p.id][dia])continue;
        const tipos=p.faz.filter(t=>tipo(t)[1]<=60);
        const t=tipos[Math.floor(rnd()*tipos.length)];
        const d=tipo(t)[1]>=60&&k+1<HORAS.length&&atende(p.id,dia,HORAS[k+1])?2:1;
        let st;
        if(dia<HOJE) st=rnd()<.1?'faltou':'finalizado';
        else if(dia===HOJE+1) st=rnd()<.7?'confirmado':(rnd()<.5?'segurado':'agendado');
        else st=rnd()<.15?'segurado':'agendado';
        let pac=nomes[n++%nomes.length];
        if(localDe(p.id,dia)!=='Espaço Pelle')pac=lago[nl++%lago.length];
        else for(let k2=0;k2<nomes.length&&!livre(pac,dia,k,d);k2++)pac=nomes[n++%nomes.length];
        EV.push({id:id++,p:p.id,h:hr,d,dia,pac,tipo:t,st,org:['Instagram','Indicação','Google','Já é paciente'][Math.floor(rnd()*4)]});
        if(d===2)k++;
      }
    });
  }
}

/* A SEMANA INTEIRA DE UM PROFISSIONAL: dias nas colunas, horários nas linhas */
function telaSemana(){
  const p = PROF.find(x=>x.id===AG_PROF);
  const evs = EV.filter(e=>e.p===p.id);
  const abertos = d=>HORAS.filter(h=>atende(p.id,d,h)).length;
  const ocupados = d=>evs.filter(e=>e.dia===d&&!['cancelou','faltou'].includes(e.st)).reduce((s,e)=>s+e.d,0);
  const pct = d=>abertos(d)?Math.round(100*ocupados(d)/abertos(d)):null;
  const totA = DIAS.reduce((s,_,d)=>s+abertos(d),0), totO = DIAS.reduce((s,_,d)=>s+ocupados(d),0);
  const futuros = evs.filter(e=>e.dia>=HOJE);
  const livresFut = DIAS.reduce((s,_,d)=>d<HOJE?s:s+abertos(d)-ocupados(d),0);
  const piorDia = DIAS.map((_,d)=>[d,pct(d)]).filter(([d,v])=>d>HOJE&&v!==null).sort((a,b)=>a[1]-b[1])[0];
  let h = `<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem">${PROF.map(x=>`<button class="opt ${x.id===p.id?'on':''}" onclick="AG_PROF='${x.id}';render()"><span class="dot" style="background:${x.cor}"></span>${x.nome} · ${x.esp}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi ${totO/totA>=.6?'ok':'amb'}"><b>${Math.round(100*totO/totA)}%</b><span>ocupação da semana de ${p.nome} ${rxF('ex')}</span></div>
    <div class="kpi"><b>${livresFut}</b><span>horários livres daqui até sábado ${rxF('ex')}</span></div>
    <div class="kpi"><b>${futuros.filter(e=>e.st==='confirmado').length} de ${futuros.filter(e=>!['finalizado','cancelou','faltou'].includes(e.st)).length}</b><span>confirmados, de hoje em diante ${rxF('ex')}</span></div>
    <div class="kpi ruim"><b>${evs.filter(e=>e.st==='faltou').length}</b><span>faltas na semana ${rxF('ex')}</span></div>
  </div>
  <div class="ag-rolo"><div class="ag ag-semana" style="grid-template-columns:56px repeat(${DIAS.length},minmax(128px,1fr))"><div class="h" style="border-left:0"></div>`;
  DIAS.forEach(([d,dt],i)=>{
    const v=pct(i);
    h+=`<div class="h" style="${i===HOJE?'box-shadow:inset 0 -2px 0 var(--neon)':''}">${d} ${dt.slice(0,2)}${i===HOJE?' <span class="chip g" style="font-size:.6rem;padding:0 6px">hoje</span>':''}
      <span class="oc" style="color:${v===null?'var(--text-faint)':v<40?'var(--coral)':v<60?'var(--ambar)':'var(--neon)'}">${v===null?'—':v+'%'}</span>
      <small>${v===null?'não atende':localDe(p.id,i)}</small>
      ${v!==null?`<div class="bar" style="height:4px;margin-top:4px"><i class="${v<40?'r':v<60?'a':''}" style="width:${v}%"></i></div>`:''}</div>`;
  });
  for(const hr of HORAS){
    h+=`<div class="hr">${hr}</div>`;
    DIAS.forEach((_,i)=>{
      const e = evs.find(x=>x.dia===i&&x.h===hr);
      const coberto = evs.find(x=>x.dia===i&&cobre(x,hr)&&x.h!==hr);
      if(!atende(p.id,i,hr)&&!e){h+=`<div class="c off"></div>`;return}
      if(e){
        h+=`<div class="c"><div class="ev s-${e.st}" style="height:${44*e.d-6}px" onclick="abrirEv(${e.id})"><b>${e.pac}</b><span class="t">${viaPill(e)}${vgSelo(e)||(e.st==='segurado'?'⏳ segurado':e.st==='sinal'?'💲 sinal até '+e.prazo:e.tipo)}</span></div></div>`;
      } else if(coberto){h+=`<div class="c"></div>`}
      else if(i<HOJE){h+=`<div class="c" style="background:#0c120f"></div>`}
      else h+=`<div class="c livre" onclick="novoAg('${p.id}','${hr}',${i})">${vgAgLivre(p.id,i,hr)}</div>`;
    });
  }
  h+=`</div></div>`;
  h+= piorDia&&piorDia[1]<50 ? `<div class="hint">⚡ <b>${DIAS[piorDia[0]][0]} ${DIAS[piorDia[0]][1]} está em ${piorDia[1]}%.</b> O Zaq já pode oferecer esses horários para quem tem retorno vencido ou plano parado com ${p.nome}. <button class="btn min" style="margin-left:.4rem" onclick="VG_FOCO='${p.id}-${piorDia[0]}';VG_ABA='hoje';ir(pode('vagas')?'vagas':'hoje');rxIr('vg-${p.id}-${piorDia[0]}')">Ver quem chamar</button></div>`
    : `<div class="hint">A semana de ${p.nome} está bem preenchida. Dias passados aparecem mais escuros; clique num horário livre para agendar.</div>`;
  if(p.id==='manoel') h+=`<div class="hint">📍 Sábado ele atende em <b>Lago da Pedra</b> (grade quinzenal). A coluna mostra o local de cada dia — é assim que a agenda itinerante aparece para a recepção.</div>`;
  return h;
}

  const q=vgQuandoDia(e.dia)+' '+e.h+' · '+rxNome(e.p);
  if(!v)return toast('Cancelado · gravado no Amigo','O horário já passou: não vira vaga.');
  toast('⚡ Horário liberado · '+q,({curta:'Falta menos de 1 h: mensagem não daria tempo. Em Vagas aparece quem já está na clínica, para você oferecer no balcão.',
    'sem-gente':'Ninguém da lista cabe nele agora. Ele entrou em Vagas › Ainda dá para encher.',
    aprovar:hjPl(v.r1.length,'pessoa cabe','pessoas cabem')+' ('+vgNomes(v.r1.map(r=>r[0]))+'). Aprove o envio em Vagas.',
    oferecendo:'No automático, a oferta sairia sozinha para '+vgNomes(v.r1.map(r=>r[0]))+', válida até '+v.ate+'.'})[v.st]+' O Zaq gravou “cancelado” no Amigo · nada foi enviado (protótipo)',true)}

/* a conversa de um horário (botão 💬 da gaveta) */
function abrirZapEv(id){const e=EV.find(x=>x.id===id);if(!e)return;
  const wa=e.conf&&/WhatsApp/.test(e.conf);
  const conf=wa?`<div class="sis">véspera · confirmação automática</div><div class="b">Oi, ${hjPrim(e.pac)}! Amanhã você tem ${palavraMsg(e.tipo)} às ${hjH(e.h)} com ${hjCom(e.p)}. Confirma? Responda <b>1</b> para confirmar ou <b>2</b> para remarcar.<div class="h">10:00 · agente</div></div><div class="b eu">1<div class="h">${(e.conf.match(/\d\d:\d\d/)||['10:12'])[0]}</div></div><div class="b">Confirmado! Até amanhã 🤝<div class="h">agente</div></div>`:'';
  abrirGav(`<div class="mut" style="font-size:.76rem">Conversa · ${viaDe(e)[2]}</div><h2>${e.pac}</h2>
  <div class="zap" style="margin-top:.6rem;max-width:none">${e.via==='agente'||e.via==='vaga'?zapReserva(e):`<div class="sis">marcado pela recepção ${e.via==='amigo'?'no Amigo':'aqui no Zaq'} · sem conversa de agendamento no WhatsApp</div>`}${conf}</div>
  <div class="acoes">${e.st==='segurado'?`<button class="btn" onclick="hjConfirmar(${id});abrirZapEv(${id})">Confirmar a reserva</button>`:''}<button class="btn sec" onclick="abrirEv(${id})">‹ Voltar ao horário</button></div>`)}

/* ---- a conversa em que o agente marca (modo padrão: segurar, e a recepção confirma) ----
   O agente diz "Reservei… a recepção confirma em instantes". O "Prontinho!! ✅ Seu
   agendamento foi realizado" só sai, automático, depois que a recepção confirma
   (hjConfirmar grava e.seg e e.confH). */
function zapReserva(e){
  const d=HJ_DIA_LONGO[e.dia], D=d[0].toUpperCase()+d.slice(1), quando=`${D}, ${DIAS[e.dia][1]}, às ${hjH(e.h)}`;
  const t0=((e.segH||'').match(/\d\d:\d\d/)||['08:44'])[0], fora=t0<'08:00'||t0>='18:00';
  const cons=tipo(e.tipo)[0]==='Consulta', com=hjCom(e.p), loc=localDe(e.p,e.dia);
  const de={Instagram:'veio do Instagram',Google:'veio do Google','Indicação':'veio por indicação','Já é paciente':'já é paciente','Vaga que abriu':'respondeu a uma vaga que abriu'}[e.org];
  let h=`<div class="sis">Centro Dermatológico Dr. Manoel Soares${de?' · '+de:''}</div>`;
  if(e.org==='Vaga que abriu'){const v=e.vaga&&VAGAS.find(x=>x.id===e.vaga); // a mesma mensagem de Vagas (VG_MSG)
    return h+`<div class="b">${vgMsgTxt('oferta',vgMsgDados(hjPrim(e.pac),e.p,e.dia,e.h,v&&v.ate))}<div class="h">${v&&v.envio?v.envio+' · ':''}agente</div></div>
    <div class="b eu">1<div class="h">${v&&v.resp||'paciente'}</div></div><div class="sis">o Zaq conferiu no Amigo que ${e.h} seguia livre</div>`
    +(v&&v.nova?`<div class="b">Que bom! Para finalizar, só preciso do seu <b>nome completo</b> e <b>data de nascimento</b> 📝 Seguro o horário por 10 min.<div class="h">agente</div></div><div class="b eu">${e.pac}, 04/07/1994<div class="h">paciente</div></div><div class="sis">o Zaq cadastrou a paciente no Amigo</div>`:'')
    +`<div class="sis">o Zaq criou o atendimento no Amigo</div><div class="b">Prontinho!! ✅ Seu agendamento foi realizado 🤝<br><b>${quando}</b> com ${com}, ${loc==='Espaço Pelle'?'na Rua Óscar Galvão, 38':'em '+loc}.<div class="h">automática</div></div>`}
  const sinal=e.st==='sinal'||e.credito;
  h+=cons
    ?`<div class="b eu">oi, quanto é a consulta com o dermatologista? tem vaga essa semana?<div class="h">${hmMais(t0,-3)}</div></div>
      <div class="b">Olá! O Centro Dermatológico Dr. Manoel Soares agradece o seu contato 🤝🏽<br>A consulta com o Dr. Manoel Soares tem o investimento de <b>R$ 500,00</b>, nela você terá avaliação completa da sua pele. Formas de pagamento: Pix, espécie ou cartão.<br>Tenho horário ${d} às ${hjH(e.h)} e em outros dias. Algum fica bom?<div class="h">${hmMais(t0,-3)}</div></div>
      <div class="sis">→ funil: Recebeu o preço</div>`
    :`<div class="b eu">oi, queria marcar ${e.tipo.toLowerCase()}${e.p!=='manoel'?' com a '+rxNome(e.p):''}. tem horário?<div class="h">${hmMais(t0,-3)}</div></div>
      <div class="b">Olá! Tenho ${d} às ${hjH(e.h)} com ${com}. Fica bom?<div class="h">${hmMais(t0,-3)}</div></div>`;
  h+=`<div class="b eu">${d} ${hjH(e.h)} dá?<div class="h">${hmMais(t0,-1)}</div></div>
    <div class="b">Dá sim! Para finalizar, só preciso do seu <b>nome completo</b> e <b>data de nascimento</b> 📝<div class="h">${hmMais(t0,-1)}</div></div>
    <div class="b eu">${e.pac}, 12/03/1990<div class="h">${t0}</div></div>`;
  if(sinal){ // horário com sinal: o "Prontinho" sai quando o Pix cai, não quando a recepção confirma
    h+=hjMsgSinal(e)+`<div class="sis">o Zaq conferiu no Amigo que o horário está livre · Agenda: aguardando sinal</div>`;
    h+=e.st==='sinal'?`<div class="sis" style="color:var(--roxo)">💲 esperando o Pix até as ${e.prazo||'18h'}</div>`
      :`<div class="sis">Pix de R$ 50 recebido · o Zaq marcou no Amigo</div><div class="b">Prontinho!! ✅ Seu agendamento foi realizado 🤝<br><b>${quando}</b> com ${com}, ${loc==='Espaço Pelle'?'na Rua Óscar Galvão, 38':'em '+loc}. Os R$ 50 viraram crédito no atendimento.<div class="h">automática, depois do Pix</div></div>`;
    return h;
  }
  /* modo "marca direto no Amigo" (Configurar › WhatsApp e agente, com o Amigo conectado): a consulta do Dr. Manoel
     na sede sai marcada na hora, sem segurar. O que já estava segurado antes de trocar o modo segue o caminho normal. */
  if(agDireto()&&cons&&e.p==='manoel'&&loc==='Espaço Pelle'&&e.dia>=HOJE&&['agendado','confirmado'].includes(e.st)&&!e.confH)
    return h+`<div class="sis">o Zaq conferiu no Amigo que o horário está livre e marcou lá · modo “marca direto”</div>
    <div class="b">Prontinho!! ✅ Seu agendamento foi realizado 🤝<br><b>${quando}</b> com ${com}, na Rua Óscar Galvão, 38. Na véspera eu te mando um lembrete.<div class="h">${t0} · agente</div></div>
    <div class="sis">→ funil: Consulta agendada</div>`;
  h+=`<div class="b">Reservei <b>${d}, ${DIAS[e.dia][1]}, às ${hjH(e.h)}</b> com ${com} para você 🤝🏽<br>${fora?'A recepção confirma a partir das 8h e eu te aviso aqui.':'A recepção confirma em instantes e eu te aviso aqui.'}<div class="h">${t0}</div></div>
    <div class="sis">o Zaq conferiu no Amigo que o horário está livre · Agenda: segurado pelo agente</div>`;
  if(e.st==='segurado') h+=`<div class="sis" style="color:var(--ambar)">⏳ esperando a recepção confirmar</div>`;
  else if(e.st==='cancelou'&&!e.confH) h+=`<div class="sis">a recepção não confirmou este horário · o Zaq não marcou no Amigo</div>
    <div class="b">Esse horário não deu 🙏 Posso te oferecer outro? Tenho outros dias com ${com} esta semana.<div class="h">agente</div></div><div class="sis">→ funil: Voltar a chamar</div>`;
  else if(e.st!=='cancelou'){const tc=e.confH||(fora?'08:05':hmMais(t0,3));
    h+=`<div class="sis">${tc} · a recepção confirmou · o Zaq marcou no Amigo</div>
    <div class="b">Prontinho!! ✅ Seu agendamento foi realizado 🤝<br><b>${quando}</b> com ${com}, ${loc==='Espaço Pelle'?'na Rua Óscar Galvão, 38':'em '+loc}. Na véspera eu te mando um lembrete.<div class="h">${tc} · automática, depois da confirmação</div></div>
    <div class="sis">→ funil: Consulta agendada</div>`}
  return h;
}
/* o que vai no WhatsApp: nome de procedimento com palavra de saúde (botox, cauterização…) vira
   "Procedimento", o mesmo filtro das mensagens automáticas (cfSaude). A tela da recepção mostra o nome. */
const msgNome=n=>cfSaude(n).length?'Procedimento':n;
const msgProc=s=>{const p=String(s).split(' · ');p[0]=msgNome(p[0]);return p.join(' · ')};
/* a conversa de um card do funil que ainda não tem horário marcado pelo agente */
function zapLead(c,col){
  const q=(c.s.match(/"([^"]+)"/)||[])[1];
  let h=`<div class="sis">Centro Dermatológico Dr. Manoel Soares</div><div class="b eu">${q||'oi, quanto é a consulta com o dermatologista?'}<div class="h">paciente</div></div>`;
  if(col!=='Novo'){const of=rxOfertaPreco().slice(0,3);
    h+=`<div class="b">Olá! O Centro Dermatológico Dr. Manoel Soares agradece o seu contato 🤝🏽<br>A consulta com o Dr. Manoel Soares tem o investimento de <b>R$ 500,00</b>, nela você terá avaliação completa da sua pele. Formas de pagamento: Pix, espécie ou cartão.${of.length?'<br>Tenho estes horários:<br>'+of.map(([dd,hh])=>'• '+dd+' às '+hh).join('<br>')+'<br>Algum fica bom?':''}<div class="h">agente</div></div>
    <div class="sis">→ funil: Recebeu o preço</div>`}
  if(col==='Plano de tratamento'){const ms=msgProc(c.s);
    h+=`<div class="sis">consulta com o Dr. Manoel · o médico propôs tratamento</div><div class="b">Oi, ${hjPrim(c.n)}! O Dr. Manoel montou seu plano 💚<div class="card-p">${ms}</div>Quer que eu já separe os horários? É só responder <b>sim</b> 🙂<div class="h">agente</div></div>`
    +(ms!==c.s?'<div class="sis">o nome do procedimento é palavra de saúde: no WhatsApp vai “procedimento”, e o nome fica na folha impressa</div>':'')}
  c.t.forEach(([x])=>{const m=x.match(/"([^"]+)"/);h+=m?`<div class="b eu">${m[1]}<div class="h">paciente</div></div>`:`<div class="sis">${x}</div>`});
  return h;
}

/* FINALIZAR: na clínica quem finaliza é o Amigo; aqui o Zaq pergunta só o que o Amigo
   não sabe. "Sim, vou montar a proposta" abre Tratamentos › Nova proposta JÁ com o
   paciente atendido (propDe). Pagamento da consulta: padrão "recebido no Amigo",
   para a recepção não lançar duas vezes. FIN guarda as respostas só nesta sessão. */
let FIN={};
function finalizar(id){const e=EV.find(v=>v.id===id);if(!e)return;
  const t=tipo(e.tipo), cons=t[2]==='consulta', v=t[4], resto=v-(e.credito||0);
  const quem=e.p==='manoel'?'O médico':rxNome(e.p);
  FIN={id,trat:cons?'sim':'nao',ret:t[3]!=='—'?t[3]:'Sem retorno',marcar:'qui 22/10 · 14:00',pag:v?'amigo':'nada'};
  const op=(k,val,rot)=>`<button class="opt ${FIN[k]===val?'on':''}" onclick="FIN.${k}='${val}';sel(this);finBotao()">${rot}</button>`;
  abrirModal(`<h2>Finalizado · ${e.pac}</h2><div class="mut" style="font-size:.84rem;margin-bottom:.8rem">${e.tipo} · ${rxNome(e.p)} · ${e.h}. Na clínica, quem finaliza é o Amigo e o Zaq recebe sozinho; aqui vão só as perguntas que o Amigo não responde, com um toque cada.</div>
  <div class="field"><label>${quem} propôs tratamento?</label><div class="opts">${op('trat','nao','Não')}${op('trat','sim','Sim, vou montar a proposta')}</div>
    <div class="faint" style="font-size:.74rem;margin-top:.25rem">Sim: você vai direto para a Nova proposta, já com ${e.pac}. O Zaq não anota diagnóstico nem queixa, só o que foi proposto e o preço.</div></div>
  <div class="field"><label>Retorno</label><div class="opts">${['Sem retorno','30 dias','60 dias','90 dias','6 meses'].map(x=>op('ret',x,x)).join('')}</div>
    <div class="faint" style="font-size:.74rem;margin-top:.25rem">Vem com o prazo do tipo "${e.tipo}"${t[3]!=='—'?' ('+t[3]+')':''}. 7 dias antes o agente pergunta o melhor dia.</div></div>
  <div class="field"><label>Marcar o retorno agora, antes de sair: quem sai com o retorno marcado não depende de alguém lembrar de chamar</label><div class="opts">${['qua 21/10 · 09:00','qui 22/10 · 14:00','Deixar para o lembrete'].map(x=>op('marcar',x,x)).join('')}</div></div>
  <div class="field"><label>Produto do protocolo</label><div class="opts"><button class="opt on" onclick="sel(this,1)">Protetor FPS 60 · R$ 89</button><button class="opt" onclick="sel(this,1)">Sérum clareador · R$ 139</button></div></div>
  <div class="field"><label>Pagamento ${cons?'da consulta':'do atendimento'}${v?' · '+brl(resto)+(e.credito?' (R$ '+e.credito+' de sinal já pago no Pix)':''):''}</label>
    ${v?`<div class="opts">${op('pag','amigo','Recebido no Amigo')}${op('pag','pix','Pix')}${op('pag','dinheiro','Dinheiro')}${op('pag','cartao','Cartão')}</div>
    <div class="faint" style="font-size:.74rem;margin-top:.25rem">Padrão: <b>recebido no Amigo</b>, para não lançar duas vezes. O Zaq só anota “pago” na ficha. Escolha Pix, dinheiro ou cartão só quando o pagamento não passou pelo caixa do Amigo.</div>`
    :`<div class="mut" style="font-size:.8rem">${e.tipo==='Sessão de pacote'?'Sessão já paga no pacote: o Zaq só desconta 1 do saldo.':'Sem cobrança.'}</div>`}</div>
  <div class="acoes" style="margin-top:.9rem"><button class="btn" id="fin-ok" onclick="finOk(${id})">${FIN.trat==='sim'?'Concluir e montar a proposta':'Concluir'}</button><button class="btn sec" onclick="fecharTudo()">Voltar</button></div>`)}
function finBotao(){const b=document.getElementById('fin-ok');if(b)b.textContent=FIN.trat==='sim'?'Concluir e montar a proposta':'Concluir'}
function finOk(id){const e=EV.find(v=>v.id===id);if(!e)return;
  e.st='finalizado';e.trat=FIN.trat;e.pag=FIN.pag;if(e.dia===HOJE)e.fimH='08:50';
  const ret=FIN.ret==='Sem retorno'?'sem retorno'
    :FIN.marcar==='Deixar para o lembrete'?'retorno em '+FIN.ret+': o agente pergunta o melhor dia 7 dias antes'
    :'retorno marcado '+FIN.marcar.replace(' · ',' às ')+' (o Zaq criou no Amigo)';
  const pag=PAG_NOME[FIN.pag]?' · pagamento: '+PAG_NOME[FIN.pag]+(FIN.pag==='amigo'?', sem lançar de novo':', anotado na ficha'):'';
  fecharTudo();
  if(FIN.trat==='sim'){propDe(e);funilPlano(e.pac);PL_ABA='nova';ir('planos');
    toast('Finalizado · '+e.pac,'O cartão foi para Plano de tratamento no Funil · '+ret+pag+'. Monte a proposta com o que '+(e.p==='manoel'?'o médico':rxNome(e.p))+' propôs.')}
  else{render();toast('Finalizado · '+e.pac,ret[0].toUpperCase()+ret.slice(1)+pag+'.')}
}
function sel(b,multi){if(!multi)[...b.parentElement.children].forEach(x=>x.classList.remove('on'));b.classList.toggle('on',multi?undefined:true)}
/* o paciente entra (ou anda) no Funil › Plano de tratamento: finalizar com proposta, Hoje › bloco 4 e o Enviar da proposta.
   Sai das colunas de venda anteriores (Consulta agendada, Recebeu o preço…). */
function funilPlano(n,pl,v){let k=null;
  for(const col of Object.keys(FUNIL)){const i=FUNIL[col].findIndex(x=>x.n===n);if(i>=0){k=FUNIL[col].splice(i,1)[0];break}}
  const s=pl?pl+(v?' · '+brl(v):''):(k&&k.s)||'Consulta · Dr. Manoel';
  FUNIL['Plano de tratamento'].unshift({n,s,t:[pl?['proposta enviada agora','']:['proposta a montar','a']]})}

/* NOVO AGENDAMENTO: busca no funil e nos pacientes; não achou, cadastra na hora só
   com nome e telefone. O Zaq cria o agendamento (e o paciente novo) no Amigo. */
let NA_NOVO=false, NA_SEL=null;   // NA_SEL: o horário escolhido no modal ({dia,hr}); novoAgOk usa ele
/* nome digitado: apóstrofo e aspas viram os tipográficos (D’Ávila), e < > saem. Assim o nome nunca quebra um onclick. */
function nomeLimpo(s){return String(s==null?'':s).replace(/'/g,'’').replace(/"/g,'”').replace(/[<>]/g,'').replace(/\s+/g,' ').trim()}
function novoAg(p,hr,dia){const pr=PROF.find(x=>x.id===p);if(!pr)return; if(dia===undefined)dia=HOJE;
  /* sem horário, horário que já passou, fora da grade ou já ocupado (o Agendar da ficha): abre no primeiro livre desse profissional */
  if(!hr||dia<HOJE||!DIAS[dia]||!atende(p,dia,hr)||(dia===HOJE&&hr<=AGORA)||rxOcupa(p,dia,hr)){const f=primeirosLivres(p,1,Math.max(HOJE,Math.min(dia,DIAS.length-1)))[0]||primeirosLivres(p,1,HOJE)[0];if(f){dia=f.d;hr=f.h}}
  NA_NOVO=false;NA_SEL={dia,hr};
  const emOf=vgOfertaEm(p,dia,hr), dl=d=>DIAS[d][0].toLowerCase()+' '+DIAS[d][1].slice(0,2);
  /* as outras opções são horários livres de verdade (a conta da Agenda), fora os que estão em oferta */
  const alt=[];for(let d=dia;d<DIAS.length&&alt.length<3;d++){
    const L=livresDe(p,d).filter(h=>!(d===dia&&h<=hr)&&!EM_OFERTA.some(o=>o.p===p&&o.dia===d&&o.h===h)&&!vgAtivaEm(p,d,h));
    L.slice(0,d===dia?1:2).forEach(h=>{if(alt.length<3)alt.push([d,h])})}
  const fu=cvCartao('Renata Dias');
  abrirModal(`<h2>Novo agendamento</h2><div class="mut" style="font-size:.84rem;margin-bottom:.7rem">Só o que a recepção preenche. O resto (fim, valor, local) se calcula.</div>
  <div class="grid2"><div>
    <div class="field"><label>Paciente</label>
      <div id="na-busca"><input class="inp" id="na-pac" placeholder="🔍 nome ou telefone" value="Renata Dias"><div class="faint" style="font-size:.72rem;margin-top:.2rem">${fu?'Achou no funil: '+fu[0]+' · '+fu[1].s:'Achou nos pacientes do Amigo'}</div>
        <button class="btn sec min" style="margin-top:.4rem" onclick="naNovo()">＋ Não achou? Cadastrar na hora</button></div>
      <div id="na-novo" style="display:none"><input class="inp" id="na-nome" placeholder="Nome completo" style="margin-bottom:.35rem"><input class="inp" id="na-tel" placeholder="Celular (WhatsApp) · (99) 9 ····-····" inputmode="tel">
        <div class="faint" style="font-size:.72rem;margin-top:.25rem">Só nome e telefone. O Zaq cria o paciente no Amigo junto com o agendamento; o resto a recepção completa no balcão, se precisar.</div></div></div>
    <div class="field"><label>Tipo de atendimento</label><select class="inp" id="na-tipo">${pr.faz.map(n=>{const t=tipo(n);return `<option value="${n}">${n} · ${t[1]} min${t[4]?' · '+brl(t[4]):''}</option>`}).join('')}</select></div>
    <div class="field"><label>Profissional</label><select class="inp"><option>${pr.nome}</option></select></div>
    <div class="field"><label>Como conheceu</label><div class="opts"><button class="opt on" onclick="sel(this)">Instagram</button><button class="opt" onclick="sel(this)">Indicação</button><button class="opt" onclick="sel(this)">Google</button><button class="opt" onclick="sel(this)">Já é paciente</button></div></div>
  </div><div>
    <div class="field"><label>Horário</label><div class="opts">${[[dia,hr]].concat(alt).map(([d,h],i)=>`<button class="opt ${i?'':'on'}" onclick="naHora(this,'${p}',${d},'${h}')">${dl(d)} · ${h}</button>`).join('')}</div>
      <div class="faint" style="font-size:.72rem;margin-top:.25rem">Só horários livres de ${pr.nome}, lidos da Agenda (o que está em oferta em Vagas não aparece).</div></div>
    <div class="linha"><span>Fim</span><span class="num" id="na-fim">${hmMais(hr,30)}</span></div>
    <div class="linha"><span>Local</span><span id="na-local">${localDe(p,dia)}</span></div>
    <div class="linha"><span>Valor</span><span>${p==='manoel'?'Consulta R$ 500 · particular · Pix, dinheiro ou cartão':'pela tabela do tipo escolhido'}</span></div>
    <div class="field" style="margin-top:.5rem"><label>Observação para a recepção</label><input class="inp"></div>
  </div></div>
  ${emOf?`<div class="hint" style="border-color:var(--ambar-borda);color:#F4D29A">⚡ ${emOf}. Marcar aqui cancela a oferta.</div>`:''}

function conta(c,turno){

  const t=TURNO[turno], dv=devemVir({fila:rtFilaEf(c)}), n=Math.min(t.vagas,dv), tk=ticketDe(c);

  return {turno,n,dv,ficamNaFila:dv-n,tk,entra,sai,sobra,horas,porHora:Math.round(sobra/horas),aMais:sobra-ficar,piso,
    vale:sobra>=Math.max(piso,1),valeAPartirDe:Math.ceil((sai+piso)/tk)};
}

function rtPessoas(c){const f=c.fila;

function rtGerar(c){
  const fila=c.fila, out=[], seed=CIDADES.indexOf(c)*11+3, esp=RT_ESP[c.n]||{}, vis=c.visitas||[];
  let k=0; const nome=()=>{const i=seed+k++;return RT_NOMES[(i*7)%RT_NOMES.length]+' '+RT_INI[(i*5+seed)%RT_INI.length]+'.'};

    const d=new Date(RT_HOJE);d.setDate(d.getDate()-(3+(fila.ped-1-i)*8));

  const cap={};vis.forEach(v=>{const f=VIAGENS.find(x=>x.c===c.n&&x.dt===v&&x.st==='fechada');cap[v]=f?f.falt:Infinity});

  return out;
}

  </div>

  <div class="faint" style="font-size:.76rem;margin-top:.5rem;line-height:1.5">Em Pedreiras, aluguel e equipe são pagos de qualquer jeito. Na viagem, combustível, sala, comida e a diária de quem vai junto só existem porque ele foi. Custos e chances são exemplo: a clínica ainda não passou os valores reais. A consulta de R$ 500 é real. ${rtF('ex')}</div>`;

/* faixa de 7 semanas (só no computador): quintas e sábados */
function rtFaixaSemanas(){
  const seg0=new Date(2026,8,21), sem=[];
  for(let w=0;w<7;w++){const d=new Date(seg0);d.setDate(d.getDate()+7*w);sem.push(d)}
  let h=`<div class="rt-so-pc"><div style="overflow-x:auto"><div class="rt-faixa"><div></div>${sem.map(d=>`<div class="rx-hd">semana de ${rtDM(d)}</div>`).join('')}`;
  [['qui',3],['sáb',5]].forEach(([nm,off])=>{
    h+=`<div class="rx-dl">${nm}</div>`;
    sem.forEach(d0=>{const d=new Date(d0);d.setDate(d.getDate()+off);const dt=rtFmt(d);
      const v=VIAGENS.find(x=>x.dt===dt&&x.st!=='trocada'), pas=d<RT_HOJE?' pas':'';
      if(v){const k=rtClasse(v);h+=`<button class="rt-fc ${k}${pas}" onclick="abrirViagem('${v.id}')"><b>${rtDM(d)}</b>${v.c}<small>${rtRotulo(v)}</small></button>`}
      else if(RT_BLOQ.includes(dt)) h+=`<div class="rt-fc r${pas}"><b>${rtDM(d)}</b>bloqueado</div>`;
      else h+=`<div class="rt-fc vazio${pas}"><b>${rtDM(d)}</b>${nm==='qui'?'Pedreiras':'—'}</div>`});
  });
  return h+`</div></div></div>`;
}
const rtClasse=v=>v.st==='fechada'?'feita':v.st==='conflito'?'r':v.st==='sugerida'?'sug':['cancelada','pulada'].includes(v.st)?'x'
  :v.st==='rascunho'||(v.st==='marcada'&&v.amigo!=='ok')?'a':'g';
const rtRotulo=v=>({fechada:'fechada',conflito:'conflito',sugerida:'sugerida',cancelada:'cancelada',pulada:'pulada',rascunho:'rascunho',aberta:'aberta'})[v.st]
  ||(v.amigo!=='ok'?'falta no Amigo':'pronta');

/* um item da linha do tempo */
function rtItem(v){
  const c=rtCid(v.c), k=rtClasse(v), pas=rtData(v.dt)<RT_HOJE;
  const pare='event.stopPropagation();';
  let t2='', bt='', chips='';
  if(v.st==='fechada'){const s=entrou(v)-v.sai;if(!pas)chips='<span class="chip">fechada na simulação</span>';
    t2=`sobraram <b>${rtBRL(s)}</b> · ${brl(Math.round(s/v.horas))}/h · ${v.atend} atendidos${v.falt?' · '+hjPl(v.falt,'falta','faltas'):''} ${rtF('am')}`}
  else if(v.st==='marcada'){const o=rtOcup(v), t=TURNO[rtTurnoDe(v.dt)];
    chips=(v.amigo==='ok'?'<span class="chip g">no Amigo ✓</span>':v.amigo==='conferindo'?'<span class="chip a">⏳ conferindo no Amigo…</span>':'<span class="chip a">falta criar o dia no Amigo</span>')
      +(v.sala==='ok'?'<span class="chip g">sala ✓</span>':'<span class="chip a">sala a confirmar</span>');
    if(v.ev) t2=`${t.txt.split(' ·')[0]} · <b>${o.marc} de ${o.vagas}</b> · ${brl(o.valor)} marcados${o.seg?' · '+hjPl(o.seg,'segurado esperando a recepção','segurados esperando a recepção'):''}${o.sinal?' · '+o.sinal+' aguardando sinal':''} · ${o.livres.length?(o.livres.length>1?'livres ':'livre ')+o.livres.join(' e '):'cheio'} ${rtF('am')}`;
    else t2=`<b>${o.marc} de ${o.vagas}</b> · ${v.amigo==='ok'?'o dia já existe no Amigo: dá para chamar a fila':'o agente só chama a fila depois que o dia existir no Amigo'} ${rtF('am')}`;
    if(v.ev&&o.livres.length) bt=`<button class="btn min" onclick="${pare}rtOferecer('${v.id}')">Oferecer à fila de ${v.c}</button>`;
    else if(!v.ev&&v.amigo==='falta') bt=`<button class="btn sec min" onclick="${pare}rtConferirViagem('${v.id}')">Já criei · conferir</button>`;
    else if(!v.ev&&v.amigo==='ok') bt=`<button class="btn min" onclick="${pare}rtChamarFila('${v.id}')">Chamar a fila de ${v.c}</button>`}
  else if(v.st==='sugerida'){const kk=conta(c,rtTurnoDe(v.dt));
    t2=`sugerida pelo Zaq · ~${kk.n} devem vir · sobram <b>${rtBRL(kk.sobra)}</b>${kk.turno==='qui'?' · '+rtBRL(Math.abs(kk.aMais))+(kk.aMais>=0?' a mais':' a menos')+' que ficar em Pedreiras':''}${v.motivo?' · '+v.motivo:''} ${rtF('zq')}`;
    bt=`<button class="btn sec min" onclick="${pare}abrirData('${v.c}','${v.dt}')">Abrir data</button>`}
  else if(v.st==='rascunho'){const f=v.abrir?faltaParaAbrir(v.abrir):[];
    chips='<span class="chip a">rascunho · ninguém foi chamado</span>'; t2=f.length?'falta: '+f.join(' · '):'pronta para abrir';
    bt=`<button class="btn sec min" onclick="${pare}abrirData('${v.c}','${v.dt}')">Continuar</button>`}
  else if(v.st==='conflito'){chips='<span class="chip r">cai no congresso (bloqueio do Configurar)</span>';
    t2=`${v.motivo} ${rtF('ex')}`;
    bt=`<button class="btn sec min" onclick="${pare}rtConflito('${v.id}','passar')">Passar para ${v.alt}</button><button class="btn sec min" onclick="${pare}rtConflito('${v.id}','pular')">Pular esta</button>`}
  else if(v.st==='aberta'){const o=rtOcup(v);chips='<span class="chip g">aberta · o agente está chamando a fila</span>';
    t2=`<b>${o.marc} de ${o.vagas}</b>${o.seg?' · '+o.seg+' com Pix pendente':''} · ${o.livres.length} livres ${rtF('am')}`;
    bt=`<button class="btn min" onclick="${pare}abrirViagem('${v.id}')">Ver o dia</button>`}
  else if(v.st==='cancelada'){chips='<span class="chip r">cancelada</span>';t2=`motivo: ${String(v.motivo||'').toLowerCase()} · todos voltaram ao topo da fila`}
  else if(v.st==='pulada'){chips='<span class="chip">pulada</span>';t2=`a fila de ${v.c} foi avisada de que a próxima é ${v.prox||'a data seguinte'}`}
  return `<div class="it ${k==='g'||k==='feita'?'g':k==='a'?'a':k==='r'?'r':''}"><div class="rt-v ${k}" role="button" tabindex="0" onclick="abrirViagem('${v.id}')">
    <div class="t1"><span class="num">${v.dt}</span><span>${v.c}</span>${chips}</div><div class="t2">${t2}</div>${bt?`<div class="acoes" style="margin-top:.35rem">${bt}</div>`:''}</div></div>`;
}

/* um cartão de cidade: 3 linhas no celular (quem, quantos vêm, quanto sobra) */
function rtCard(c){
  const k=conta(c), ab=VIAGENS.find(v=>v.c===c.n&&v.st==='aberta'), vd=ab?'ABERTA':VEREDITO(c), ult=rtUlt(c), f=c.fila, tot=naFila(c)||1;

  let nota='', bt='';
  if(ab){nota=`${ab.dt} aberta · o agente está chamando a fila`;bt=`<button class="btn min" onclick="event.stopPropagation();abrirViagem('${ab.id}')">Ver o dia ${ab.dt}</button>`}
  else if(vd==='VALE'){const s=rtSugDe(c);nota=`a partir do ${k.valeAPartirDe}º paciente já vale`;bt=`<button class="btn min" onclick="event.stopPropagation();abrirData('${c.n}','${s}')">Abrir ${s}</button>`}

    nota=`${c.fixa}${o?` · cabem ${o.livres.length} em ${px[0].dt.split(' ')[1]} e o resto ${px[1]?'em '+px[1].dt.split(' ')[1]:'na próxima'}`:''}`;
    if(px[0]&&o.livres.length&&px[0].ev) bt=`<button class="btn min" onclick="event.stopPropagation();rtOferecer('${px[0].id}')">Oferecer à fila</button>`}
  else if(vd==='AINDA NÃO') nota=k.turno==='sab'?`para gastar um sábado precisa sobrar ${brl(PISO_SAB)}: vale a partir de ${k.valeAPartirDe} pacientes, falta ~${k.valeAPartirDe-k.n}`

  else nota=c.via<1?`fica a ${c.viaTxt}: o agente oferece Pedreiras`:'o agente oferece Pedreiras ou a data aberta mais perto';
  const qui=k.turno==='qui';
  return `<div class="rt-cid" role="button" tabindex="0" onclick="abrirCidade('${c.n}')">
    <div class="l1"><span class="nm">${c.n}</span><span class="rt-selo ${RT_SELO[vd]}">${vd}</span><span class="chip">${c.fixa?'sábado':TURNO[k.turno].nome}</span><span class="faint" style="margin-left:auto;font-size:.72rem">${c.viaTxt} de estrada</span></div>${barra}
    <div class="l2"><span${hl('esperando')}>${esperando(c)} esperando</span> + <span${hl('convidar')}>${convidar(c)} para convidar</span> ${(c.aVencer||[]).length?` + ${c.aVencer.length} retornos que vencem em ${c.aVencerEm}`:''} → <b>~${k.n} devem vir</b>${k.ficamNaFila>0?` <span class="faint">(${k.ficamNaFila} ficam para a próxima)</span>`:''}</div>
    <div class="l3">${k.sobra>=0?'sobram':'falta'} <b class="big" style="${k.sobra<0?'color:#F08A83':''}">${k.sobra>=0?rtBRL(k.sobra):rtBRL(-k.sobra)}</b>${qui?` · <b>${rtBRL(k.aMais)}</b> ${k.aMais>=0?'a mais':'a menos'} que ficar`:''} ${rtF('zq')}
      <small>entram ${k.n} × ${brl(k.tk)} = ${brl(k.entra)}, saem ${brl(k.sai)} · ${brl(k.porHora)}/h em ${rtHoras(k.horas)}, com a estrada${qui?' (um dia em Pedreiras: '+brl(SEDE.qui.hora)+'/h)':''}</small></div>
    <div class="l4">${nota} · ${ult?'última visita '+ult+', '+rtHa(ult):'nunca houve atendimento lá no Amigo'}</div>
    ${bt?`<div class="acoes">${bt}</div>`:''}
  </div>`;
}

/* a conversa de Codó: a MESMA em Conversas (CONV id 6, c.cid) e no Roteiro. O agente oferece
   Pedreiras primeiro; o "pode avisar" põe a pessoa na fila da cidade, e o número que o agente diz
   é a posição dela na gaveta Roteiro › Codó › Quem espera (rtFila), recalculada a cada tela. */
const RT_CONV_CODO=6;
function rtPosConv(c,conv){const L=rtFila(c), i=L.findIndex(p=>p.conv===conv);return i>=0?i+1:esperando(c)+1}
const rtFilaFrase=(cid,pos)=>`Combinado! Você é o <b>nº ${pos}</b> na lista de quem espera o Dr. Manoel em ${cid}. Quando ele abrir data aí, eu te aviso por aqui 🙂 Para não receber mais, responda SAIR.`;
function rtZapCodoMsgs(c){const pos=c?rtPosConv(c,RT_CONV_CODO):11, esp=c?esperando(c):11;
  return `<div class="b eu">bom dia, o doutor atende em Codó?<div class="h">ontem 07:12 · (99) 9····-··17</div></div>
    <div class="b">Bom dia! Ainda não tem data em Codó. Ele atende em Pedreiras na quinta (24/09) às 9h, se quiser. Ou posso te avisar quando ele abrir um dia aí?<div class="h">07:12 · agente</div></div>
    <div class="b eu">pode avisar<div class="h">07:15</div></div>
    <div class="b">${rtFilaFrase('Codó',pos)}<div class="h">07:15 · agente</div></div>
    <div class="sis">→ fila de Codó · nº ${pos} de ${esp} que esperam o médico · pediu no WhatsApp</div>`}
function rtZapCodo(c){return `<div class="zap" style="max-width:none">${rtZapCodoMsgs(c)}</div>`}

  <div class="tabs" style="margin-top:.5rem"><button class="${RT_CAB==='quem'?'on':''}" onclick="RT_CAB='quem';abrirCidade('${c.n}')">Na fila · ${naFila(c)}</button><button class="${RT_CAB==='conta'?'on':''}" onclick="RT_CAB='conta';abrirCidade('${c.n}')">A conta</button></div>`;

function rtAbaQuem(c){

  <div class="faint" style="font-size:.74rem">Na fila: ${esperando(c)} esperando o médico (retorno vencido e pediu no WhatsApp) e ${convidar(c)} para convidar (faltou e sumido). Nomes de exemplo ${rtF('ex')}</div>`;
  h+=vis.map((p,i)=>`<div class="rt-p"><span class="num faint" style="width:22px">${i+1}</span><span style="flex:1;min-width:0"><b>${p.nome}</b><small>${ORIGEM[p.org][0]} · ${p.desde}</small></span><span class="via ${p.f==='Amigo'?'am':p.f==='WhatsApp'?'ag':'rc'}">${p.f}</span></div>`).join('');

  <div class="acoes"><button class="btn sec" onclick="abrirPorNaFila('${c.n}')">+ pôr na fila</button></div>`;

function rtAbaConta(c){

  const out=[a.base], add=(dt,passo)=>{let d=dt,i=0;while(ocup(d)&&i<6){d=rtMais(d,passo);i++}if(!out.includes(d))out.push(d)};

  add(rtTurnoDe(a.base)==='qui'?rtMais(a.base,2):rtMais(a.base,-2),7);
  if(!out.includes(a.dt))out.push(a.dt);
  return out;

const RT_ORD16=[0,2,4,1,3,8,10,5,12,9,11,13,6,7,14,15], RT_ORD8=[0,2,1,4,3,5,6,7];

/* quem vem, em que horário e em que passo da animação. Quantos vêm de cada origem:

function rtPlano(v){
  const f=v.filaAntes, hs=rtHorasDia(v.turno), n=Math.min(hs.length,devemVir({fila:f})), q={};let tot=0;
  const exp=Object.keys(CHANCE).map(k=>[k,f[k]*CHANCE[k]]);exp.forEach(([k,x])=>{q[k]=Math.floor(x+1e-9);tot+=q[k]});
  exp.slice().sort((a,b)=>(b[1]-Math.floor(b[1]))-(a[1]-Math.floor(a[1]))).forEach(([k])=>{if(tot<n&&q[k]<f[k]){q[k]++;tot++}});
  for(const k of ['sum','fal','ped','ret'])while(tot>n&&q[k]>0){q[k]--;tot--}
  const L=v.pessoasAntes, pega=o=>L.filter(p=>p.org===o).slice(0,q[o]);
  const r1=pega('ret').concat(pega('ped')), r2=pega('fal').concat(pega('sum')), ord=hs.length===16?RT_ORD16:RT_ORD8, P=[];

  r2.forEach((p,j)=>{const inv=8+Math.floor(j/5)*3;P.push({...p,src:p,inv,res:inv+2+(j%2)})});
  P.forEach((p,i)=>{p.i=ord[i];p.h=hs[ord[i]];p.isento=p.org==='ret'&&!semSinal;p.tipo=p.org==='ret'?'Retorno':'Consulta'});

}

   Hoje › bloco 4 e a ficha). Vem com o procedimento que esse profissional mais propõe
   no quadro de Propostas (exemplo); a recepção troca pelo que foi proposto hoje. */
function propDe(e){if(!e)return;
  const pr=rxNome(e.p), cont={};
  Object.values(PROPS).forEach(cs=>cs.forEach(x=>Object.keys(PROCS).forEach(n=>{if(PROCS[n].prof===pr&&x.pl.startsWith(n))cont[n]=(cont[n]||0)+1})));
  const top=Object.keys(cont).sort((a,b)=>cont[b]-cont[a])[0]||Object.keys(PROCS).find(n=>PROCS[n].prof===pr)||null;
  PROP.pac=e.pac;PROP.prof=pr;PROP.sugerido=top;
  PROP.de='a partir '+(tipo(e.tipo)[2]==='consulta'?'da consulta':'do atendimento')+' de '+DIAS[e.dia][1]+' com '+pr;
  PROP.itens=top?[[top,PROCS[top].ses]]:[];
}
function propTotais(){
  const proc=PROP.itens.reduce((s,[n,q])=>s+PROCS[n].preco*q,0);
  const prod=Object.entries(PROP.prods).filter(([,on])=>on).reduce((s,[n])=>s+PRODS[n],0);
  const bruto=proc+prod;
  const desc=PROP.pag==='pix'?Math.round(bruto*PROP.desc/100):0;
  const liq=bruto-desc;
  return {proc,prod,bruto,desc,liq};
}
function datasSessoes(){
  const base=new Date(2026,8,30); const out=[];
  PROP.itens.forEach(([n,q])=>{const pr=PROCS[n];for(let i=0;i<q;i++){const d=new Date(base);d.setDate(d.getDate()+i*(pr.int||0));out.push(n.split(' ')[0]+' '+(i+1)+': '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}))}});
  return out.slice(0,8);
}

let RX_REAL=false, RX_PROF='todos', RX_FEITO={};
const RX_FONTE={wa:['real · WhatsApp','zap'],zaq:['real · Zaq','zap'],amigo:['Amigo · 22/09','amigo'],ex:['exemplo','ex'],merc:['mercado','merc']};
const rxF=k=>`<span class="fonte ${RX_FONTE[k][1]}" style="margin-left:0">${RX_FONTE[k][0]}</span>`;
/* RX_WA, RX_AMIGO e RX_MERC (os números reais e a régua de mercado) moram no topo do
   script, junto com os outros dados: toda tela lê de lá. */
const RX_TURNO={manha:h=>h<'12:00',tarde:h=>h>='12:00',dia:()=>true};
const RX_TURNO_NOME={manha:'manhã',tarde:'tarde',dia:'dia inteiro'};
const rxVivo=e=>!['cancelou','faltou'].includes(e.st);
const rxOcupa=(p,d,h)=>EV.some(e=>e.p===p&&e.dia===d&&rxVivo(e)&&cobre(e,h));
const r10=v=>Math.round(v/10)*10;
const rxNome=id=>PROF.find(x=>x.id===id).nome;
const rxDia=d=>DIAS[d][0].toLowerCase()+' '+DIAS[d][1];
const rxBRL=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
function rxCel(p,d,t){
  const ab=HORAS.filter(h=>RX_TURNO[t](h)&&atende(p,d,h)), livres=ab.filter(h=>!rxOcupa(p,d,h));

/* =================================================================
   8 · CONFIGURAR — "Clínica e agente" (rota 'config')
   O combinado entre a clínica e o Zaq, em três perguntas: o que existe
   hoje (real), o que o Zaq vai fazer sozinho (escolhido para quando
   ligar) e o que falta a clínica responder.
   - Abas (CF_ABA): resumo (Colocar no ar) · amigo · agente (WhatsApp e
     agente) · msgs (Mensagens automáticas) · prof · tipos · locais ·
     grade. 'prof', 'tipos', 'locais' e 'grade' continuam com o mesmo id
     (Roteiro e Vagas apontam para 'locais' e 'grade').
   - Real hoje: WhatsApp conectado por QR; Amigo NÃO conectado (lido à
     mão em 22/09: agendamento on-line e robô não configurados); agente
     desligado. "Conectar", "Importar" e "Ligar agora" são simulação
     (AMIGO.conectado, CF_IMPORTADO, CF_LIGADO); "Ver como fica ligado"
     (CF_SIM) só troca o que os status mostram.
   - Uma agenda só, a do Amigo. Onde o Amigo não tem grade (Juliana,
     Brenda, cidades), o Zaq usa grade provisória e tudo fica segurado.
     A grade exibida é calculada de atende() (cfFaixas): a mesma da
     Agenda, de Vagas e do Raio-X.
   - Números reais leem RX_WA e RX_AMIGO; agenda, funil e pacotes leem
     EV, FUNIL, POS e SESS. Nada envia mensagem e nada salva de verdade.
   - Texto de mensagem só vale depois de "Salvar texto" (CF_RASC guarda
     o rascunho); palavra de saúde avisa antes de salvar (CF_AVISO).
   ================================================================= */
let CF_ABA='resumo';           // resumo | amigo | agente | msgs | prof | tipos | locais | grade

    seg:pes(e=>e.st==='segurado').filter(n=>!recebe.includes(n)),sinal:pes(e=>e.st==='sinal').filter(n=>!recebe.includes(n)),
    sim:pes(e=>e.st==='confirmado'),sem:pes(e=>e.st==='agendado'&&e.vesp==='-'),rem:HJ_REM.filter(r=>r.dia===HOJE+1).map(r=>r.pac)}}
