  if(!txt)return;CF_CHAT.push({de:'eu',t:rtEsc(txt)});cfChatResponder(txt);cfChatPintar()}
function cfChatResponder(txt){const s=cfNorm(txt), F=k=>rtEsc(AGENTE.frases[k]), ag=t=>CF_CHAT.push({de:'ag',t}), sis=t=>CF_CHAT.push({de:'sis',t}), st=CF_CHAT_ST;
  const pd=k=>{const p=AGENTE.pode.find(x=>x[0]===k);return p?p[2]:false}, of=rxOfertaPreco(), amigo=AMIGO.conectado||CF_SIM;
  const recep=(t,por)=>{ag(t);sis('→ passou para a recepção: '+por+' · a conversa sobe em Conversas com a etiqueta “recepção”');st.etapa='recepcao'};
  if(/^sair\b|\bsair$/.test(s)){ag('Pronto! Você não vai mais receber mensagens automáticas da clínica. Se precisar, é só escrever aqui 🙂');sis('→ SAIR: lembretes, avisos de vaga, pós-venda e aniversário desligados para este número');st.etapa='inicio';return}
  if(/urgen|emergen|inchou|inchad|sangr|falta de ar|respirar/.test(s)){ag('Isso precisa de atendimento agora: procure o pronto atendimento mais perto. Já avisei a recepção 🙏');sis('→ recepção avisada na hora · o agente não orienta tratamento');st.etapa='recepcao';return}
  if(/pessoa|atendente|humano|robo|falar com alguem/.test(s))return recep('Claro! Já chamei a recepção, ela te responde aqui 🙂','pediu para falar com alguém');
  if(/mancha|coca|coceira|acne|espinha|remedio|pomada|ferida|verruga|caroco|queda de cabelo|o que pode ser|sintoma|diagnost|foto/.test(s))
    return recep('Sobre isso, quem pode te orientar é o Dr. Manoel, na consulta 🙂 Já chamei a recepção para te ajudar.','pergunta de saúde (o agente não fala de sintoma; a mensagem fica só nesta conversa do WhatsApp: o Zaq não copia para ficha, funil ou fila)');
  if(/desconto|mais barato|convenio|plano de saude|unimed|hapvida/.test(s))return recep('Isso quem vê é a recepção. Já chamei, ela te responde aqui 🙂','desconto ou convênio');
  if(st.etapa==='cidade'&&/^(sim|pode|quero|avisa|pode avisar)/.test(s)){const c=st.cid||'a cidade', cc=rtCid(c), pos=cc?esperando(cc)+1:null;
    ag('Combinado!'+(pos?' Você é o <b>nº '+pos+'</b> na lista de quem espera o Dr. Manoel em '+c+'.':'')+' Te aviso aqui assim que tiver data e endereço certos 🙂');
    sis('→ entrou na fila de '+c+(pos?' (nº '+pos+', depois dos '+(pos-1)+' que já esperam)':'')+', no Roteiro · a fila guarda nome, telefone e cidade, nunca a frase · teste: ninguém entra de verdade');st.etapa='inicio';return}
  const cid=CIDADES.find(c=>s.includes(cfNorm(c.n)));
  if(cid){const L=LOCAIS.find(l=>l[0]===cid.n), end=L&&L[1]!=='a confirmar', px=rtProxDe(cid)[0], sede=of.find(x=>x[0]!==rxDia(HOJE))||of[0];st.cid=cid.n;st.etapa='cidade';
    if(!pd('quando'))return recep('Vou pedir para a recepção te responder sobre '+cid.n+' 🙂','pergunta de cidade');
    if(px&&end&&px.amigo==='ok'){ag(`Tem sim! O Dr. Manoel atende em ${cid.n} ${rtNoDia(px.dt)}, em ${rtEsc(L[1])}. Quer que eu veja um horário?`);sis('→ em cidade, o agente marca só consulta e retorno, sempre segurado');return}
    ag(`${px?`Ele vai a ${cid.n} ${rtNoDia(px.dt)}, mas o endereço ainda vai ser confirmado.`:`Ainda não tem data em ${cid.n}.`} Ele atende em Pedreiras de segunda a sexta${sede?` (tenho ${HJ_DIA_LONGO[DIAS.findIndex((_,i)=>rxDia(i)===sede[0])]} às ${hjH(sede[1])})`:''}. Ou posso te avisar quando ${px?'estiver tudo certo':'ele abrir um dia aí'}?`);
    sis('→ se disser sim: fila de '+cid.n+', no Roteiro · sem data e endereço confirmados, o agente não marca na cidade');return}
  if(/botox|laser|peeling|limpeza|criolipolise|preenchimento|procedimento|depilacao|cauterizacao|bioplastia/.test(s)){ag(F('procedimento'));st.etapa='inicio';return}
  if(st.etapa==='ofereceu'&&/(\d{1,2}\s*(h|:)|\bqua|\bqui|\bsex|\bseg|\bter|hoje|amanha|primeir|pode ser|esse|essa|quero)/.test(s)){
    let i=/\bqui|amanha/.test(s)?of.findIndex(x=>/^qui/.test(x[0])):/\bsex/.test(s)?of.findIndex(x=>/^sex/.test(x[0])):0;if(i<0)i=0;
    st.h=of[i];ag(F('dados'));st.etapa='dados';return}
  if(st.etapa==='dados'&&/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s)){const [d,h]=st.h||of[0]||[rxDia(HOJE),'13:30'], v=cfSlotVals(d,h);
    if(!pd('marcar'))return recep('Anotei! A recepção confirma seu horário por aqui 🙂','marcar está desligado para o agente');
    if(AGENTE.marca==='direto'&&AMIGO.conectado){sis('o Zaq conferiu no Amigo que o horário está livre e marcou lá');ag(rtEsc(cfFill(AGENTE.frases.marcado,v)));sis('→ Agenda: marcado pelo agente · → Funil: Consulta agendada');st.etapa='fim';return}
    sis('o Zaq conferiu no Amigo que o horário está livre');ag(rtEsc(cfFill(AGENTE.frases.segurado,v)));
    sis('→ Agenda: segurado pelo agente · → Funil: Consulta agendada · a recepção confirma em até 30 min, no horário dela');st.etapa='segurou';return}
  if(st.etapa==='preco'&&/(\d{1,2}\s*(h|:)|\bqua|\bqui|\bsex|hoje|amanha|horario|vaga)/.test(s))return recep('Vou pedir para a recepção ver esse horário para você 🙂','marcar sem o Amigo conectado');
  if(/quanto|valor|preco|custa|consulta|marcar|agendar|horario|vaga/.test(s)){
    if(!pd('precoConsulta'))return recep('A recepção já te passa o valor 🙂','preço desligado para o agente');
    const ofe=amigo&&pd('horarios')&&of.length;
    ag(F('saudacao')+'<br>'+F('preco')+(ofe?'<br>Tenho estes horários:<br>'+of.map(([d,h])=>'• '+d+' às '+hjH(h)).join('<br>')+'<br>Algum fica bom?':'<br>A recepção já te passa os horários livres 🙂'));
    sis('→ Funil: Recebeu o preço'+(ofe?'<span class="dev"> · os 3 horários são os do Raio-X</span>':amigo?'':' · sem o Amigo conectado, o agente não vê horário livre: a recepção marca'));
    st.etapa=ofe?'ofereceu':'preco';return}
  if(/endereco|onde fica|localizacao|como chego/.test(s)){ag('Ficamos na Rua Óscar Galvão, 38, em Pedreiras 📍');return}
  if(/quando|que dia|atende|funciona|abre/.test(s)){ag('O Dr. Manoel atende em Pedreiras de segunda a sexta, '+cfFaixas('manoel',0).split(' e ').map(x=>'das '+x.replace('–',' às ')).join(' e ')+'. Quer que eu veja um horário?');return}
  if(/^(oi|ola|bom dia|boa tarde|boa noite)/.test(s)){ag(F('saudacao')+'<br>Como posso te ajudar?');return}
  if(/obrigad|valeu/.test(s)){ag('Por nada! Qualquer coisa, é só chamar 🤝🏽');return}
  recep('Não entendi bem 🙂 Vou chamar a recepção para te ajudar.','o agente não entendeu')}
function cfChatConfirmar(){const st=CF_CHAT_ST;if(st.etapa!=='segurou')return;const of=rxOfertaPreco(), [d,h]=st.h||of[0]||[rxDia(HOJE),'13:30'];
  CF_CHAT.push({de:'sis',t:'a recepção confirmou · o Zaq marcou no Amigo'});CF_CHAT.push({de:'ag',t:rtEsc(cfFill(AGENTE.frases.marcado,cfSlotVals(d,h)))});st.etapa='fim';cfChatPintar()}

/* =================================================================
   HOJE — a tela inicial: o que a recepção faz ao abrir o sistema de manhã,
   em ordem de prioridade. Cada bloco tem contagem, lista curta e o botão
   que resolve (ou leva à tela certa).
   - Números do WhatsApp vêm de RX_WA e os do Amigo de RX_AMIGO (reais).
     Nomes, horários e listas são de exemplo: a mesma Agenda (EV), Funil
     (FUNIL) e Vagas (VAGAS) das outras telas.
   - "Agora" é quarta 23/09, 8h50. A confirmação da véspera sai às 10h;
     hjLote() simula as respostas das 10h30 (HJ_LOTE=true).
   - Sinal por Pix: EV com st 'sinal' ("aguardando sinal", prazo em e.prazo).
     Pago → vira crédito e o horário fica marcado; não pago → libera a vaga
     (entra em VAGAS). rxVivo já conta 'sinal' como ocupado.
   - Nada envia mensagem nem salva: os botões mudam o estado só nesta sessão.
   ================================================================= */
let HJ_LOTE=false, HJ_RET_OK=false, HJ_ABRE={};
let HJ_REM=[]; // quem respondeu 2 (quer remarcar): {pac,dia,q,prof,of}
const hjAgora='8h50';
const HJ_DIA_LONGO=['segunda','terça','quarta','quinta','sexta','sábado'];
const HJ_NOITE_AGENTE=5; // exemplo: quantas mensagens o agente respondeu de noite
const HJ_NOITE=[ // exemplo: chegaram de noite e o agente passou para a recepção
  {n:'Rogério Alves',t:'consegue fazer o botox por 1.400?',q:'ter 21:12',por:'pediu desconto: quem decide é a clínica',r:'Bom dia, Rogério! No Pix à vista consigo 5%: o botox fica R$ 1.520. Quer que eu já separe um horário com o Dr. Manoel?'},
  {n:'Heitor Lima',t:'queria falar com uma pessoa, não com robô',q:'ter 22:40',por:'pediu para falar com a recepção',r:'Bom dia, Heitor! Aqui é a recepção do Centro Dermatológico. Em que posso te ajudar?'},
  /* o "atende em Codó?" de ontem NÃO está aqui: o agente respondeu e pôs a pessoa na fila da cidade (Conversas › id 6 e Roteiro › Codó) */
  {n:'Graça Moreira',t:'vocês atendem pelo plano da prefeitura?',q:'qua 06:48',por:'falou de convênio: quem confere é a recepção',r:'Bom dia, Graça! Vou conferir o seu plano e já te respondo por aqui. Se preferir particular, a consulta com o Dr. Manoel é R$ 500,00, no Pix, dinheiro ou cartão.'},
];
const HJ_RET=[['Carlos Mendes',12],['Josué Almeida',9],['Rosângela Sá',7],['Benedito Lima',5],['Irene Castro',3]]; // exemplo: os 5 mais atrasados dos retornos pedidos
/* os retornos de hoje seguem a regra de 1 mensagem automática por pessoa por dia: quem já recebeu
   outra hoje (oferta de vaga, convite) fica para amanhã. vgMsgHoje(true) = sem contar os próprios retornos. */
function hjRetLista(){const ja=vgMsgHoje(true);return {vao:HJ_RET.filter(([n])=>!ja.has(n)),amanha:HJ_RET.filter(([n])=>ja.has(n))}}
/* por que fica para amanhã (e, se a pessoa vem hoje, que dá para marcar no balcão) */
function hjRetMotivo(n){const e=EV.filter(x=>x.pac===n&&x.dia===HOJE&&rxVivo(x)).sort(hjOrd)[0];
  return 'já recebeu uma mensagem automática hoje'+(e?' · vem hoje às '+hjH(e.h)+' com '+hjCom(e.p)+': dá para marcar o retorno no balcão':'')}
const HJ_PIX=[ // exemplo
  {n:'Fábio Mendes',o:'4ª parcela da criolipólise',v:800,q:'vence hoje',k:'a',nota:'o link de Pix sai sozinho às 9h'},
  {n:'Sônia Pires',o:'assinatura Pele em dia',v:149,q:'cartão recusado',k:'r',nota:'link de Pix mandado ontem, ainda não pago'},
  {n:'Marta Silva',o:'parcela do pacote de depilação a laser',v:350,q:'atrasada desde 18/09',k:'r',nota:'2º lembrete hoje · pacote parado há 64 dias'},
];
const hjOrd=(a,b)=>a.dia-b.dia||(a.h<b.h?-1:a.h>b.h?1:0);
const hjQuando=e=>(e.dia===HOJE?'hoje':e.dia===HOJE+1?'amanhã':e.dia===HOJE-1?'ontem':rxDia(e.dia))+' '+e.h;
const hjH=h=>{const [a,b]=h.split(':');return (+a)+'h'+(b==='00'?'':b)};
const hjPrim=n=>n.split(' ')[0];
const hjCom=p=>p==='manoel'?'o Dr. Manoel':'a '+rxNome(p);
const hjFrase=t=>{const m=t.match(/"([^"]+)"/);return m?m[1]:t};
const hjPl=(n,um,varios)=>n+' '+(n===1?um:varios);
const hjE=a=>a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:a[0]||'';
/* a confirmação da véspera é por pessoa: 2 horários no mesmo dia = 1 mensagem (a regra de Configurar › Mensagens) */
const hjPorPessoa=L=>{const s=new Set();return L.filter(e=>!s.has(e.pac)&&s.add(e.pac))};   // o 1º horário de cada pessoa
const hjPessoas=L=>new Set(L.map(e=>e.pac)).size;
const hjDoDia=(e,f)=>EV.filter(x=>x.pac===e.pac&&x.dia===e.dia&&(f?f(x):true)).sort(hjOrd);
/* a frase da mensagem: palavra comum (e o nome do estético, se for um deles), nunca o procedimento */
const hjConfFrase=evs=>evs.map(e=>{const nm=NOME_NA_MSG.find(n=>String(e.pac_s||'').startsWith(n));return palavraMsg(e.tipo)+(nm?' de '+nm.toLowerCase():'')+' às '+hjH(e.h)+' com '+hjCom(e.p)}).join(' e ');
function hjLivre(p,dia,de){return HORAS.find(h=>h>=de&&atende(p,dia,h)&&!EV.some(e=>e.p===p&&e.dia===dia&&cobre(e,h)))}

/* roda uma vez, depois de gerarSemana() */
function hjPreparar(){
  /* a confirmação de amanhã sai hoje às 10h: ninguém de amanhã confirmou ainda */
  EV.forEach(e=>{if(e.dia===HOJE+1&&e.st==='confirmado')e.st='agendado'});

  /* topo: data + uma linha de resumo (o bloco 6 é o agente trabalhando: só acompanhar) */
  const B=[[1,noite.length,'mensagem da noite','mensagens da noite'],[2,segs.length,'horário segurado','horários segurados'],[3,nLigar,'sem resposta à confirmação','sem resposta à confirmação'],
    [4,fins.length,'finalizado sem resposta','finalizados sem resposta'],[5,vv.length,'disse "vou ver"','disseram "vou ver"'],[6,vagasOf,'vaga em oferta','vagas em oferta'],
    [7,nRet,'retorno a chamar','retornos a chamar'],[8,sinais.length+pix.length,'Pix vencendo','Pix vencendo']];
  const lb=b=>b[1]+' '+(b[1]===1?b[2]:b[3]);
  const tot=B.filter(b=>b[0]!==6).reduce((s,b)=>s+b[1],0)+vgPend, prim=B.find(b=>b[0]!==6&&b[1])||(vgPend?B[5]:undefined); // vaga só conta quando espera a recepção aprovar
  let h=`<div class="pg-h"><div><h1>Hoje</h1><div class="sub">Quarta, 23 de setembro de 2026 · agora ${hjAgora} · o que fazer primeiro, em ordem</div></div>
    <button class="btn sec hj-so-pc" onclick="CV_FILTRO='pacientes';ir('conversas')">💬 Conversas</button></div>
  ${cfAvisoHoje()}<div class="hj-top">${tot?`<b>${hjPl(tot,'coisa','coisas')} para resolver hoje.</b> Primeiro: ${lb(prim)}.`:'<b>Tudo em dia.</b> Nada esperando a recepção agora.'}${HJ_LOTE?'':' A confirmação de amanhã sai sozinha às 10h.'}</div>
  <div class="hj-res">${B.map(b=>`<button class="${b[1]?(prim&&b[0]===prim[0]?'pri':''):'ok'}" onclick="rxIr('hj-${b[0]}')">${b[0]} · <b>${b[1]}</b> ${b[1]===1?b[2]:b[3]}</button>`).join('')}</div>
  <div class="rx-leg">${rxF('wa')}${rxF('amigo')}${rxF('ex')}<span>Números do WhatsApp e do Amigo são reais; nomes, horários e listas são de exemplo.</span></div>`;

  /* 1 · mensagens da noite (o furo real é a abertura do dia) */
  const f0=W.faixas[0], p0=Math.round(100*f0[2]/f0[1]), po=W.faixas.slice(1).map(x=>Math.round(100*x[2]/x[1]));
  h+=bloco(1,noite.length,cab(1,'Mensagens da noite sem resposta',noite.length,
      `Chegaram depois das 18h de ontem. O agente respondeu ${HJ_NOITE_AGENTE} (preço, horário, endereço); estas ele passou para a recepção.`,rxF('ex'))
    +(noite.length?noite.map(([x,i])=>it(x.q,x.n,`"${x.t}" · ${x.por}`,`<button class="btn min" onclick="abrirNoite(${i})">Responder</button>`)).join(''):feito('Todas as mensagens da noite foram respondidas.'))
    +`<div class="acha"><b>Por que vem primeiro:</b> no último mês, na faixa ${f0[0]}, só ${f0[2]} de ${f0[1]} (${p0}%) foram respondidas em até 5 min, contra ${Math.min(...po)}% a ${Math.max(...po)}% no resto do dia, e ${f0[3]} ficaram mais de 24h sem resposta. É a fila da noite. ${rxF('wa')}</div>
    <div class="faint" style="font-size:.74rem;margin-top:.4rem">Na segunda, some o sábado: no mês, ${W.sab.n} pacientes escreveram no sábado e ${W.sab.sem24} ficaram sem resposta em 24h. ${rxF('wa')}</div>
    <div class="acoes"><button class="btn sec min" onclick="CV_FILTRO='pacientes';ir('conversas')">Abrir Conversas</button></div>`);

  /* 2 · segurados pelo agente, esperando a recepção */
  h+=bloco(2,segs.length,cab(2,'Horários segurados pelo agente',segs.length,
      'O agente reservou e disse ao paciente: "Reservei… a recepção confirma em instantes". Confira e confirme a reserva: o Zaq marca no Amigo e o paciente recebe "Prontinho!! ✅ Seu agendamento foi realizado". A confirmação de presença é outra: sai na véspera.',rxF('ex'))
    +(segs.length?segs.map(e=>it(hjQuando(e),e.pac,`${e.tipo} · ${rxNome(e.p)} · o agente segurou ${e.segH||''}`,`<button class="btn min" onclick="hjConfirmar(${e.id})">Confirmar a reserva</button><button class="btn sec min" onclick="abrirEv(${e.id})">Ver</button>`)).join(''):feito('Nenhum horário esperando você.'))
    +`<div class="faint" style="font-size:.74rem;margin-top:.45rem">Lista de hoje e amanhã.${segDepois?` Mais ${segDepois} de sexta e sábado estão na Agenda.`:''} Fora do horário, o agente avisa que a recepção confirma a partir das 8h. ${agDireto()
      ?'Modo atual: <b>marca direto no Amigo</b> a consulta do Dr. Manoel na sede (escolhido em Configurar › WhatsApp e agente). O resto continua segurado.'
      :'Modo atual: <b>segurar, e a recepção confirma</b> (padrão). '+(AGENTE.marca==='direto'?'O “marca direto”, escolhido em Configurar, só vale com o Amigo conectado.':'Em Configurar › WhatsApp e agente dá para passar a marcar direto no Amigo.')}</div>
    <div class="acoes">${segs.length>1?`<button class="btn min" onclick="hjConfirmarTodos()">Confirmar as ${segs.length} reservas</button>`:''}<button class="btn sec min" onclick="AG_VISTA='dia';ir('agenda')">Ver na Agenda</button></div>`);

  /* 3 · confirmação da véspera: 1, 2 e sem resposta */
  const linLigar=e=>{const mais=hjDoDia(e,x=>x!==e&&x.st==='agendado');
    return it(hjQuando(e),e.pac,`${e.tipo} · ${rxNome(e.p)}${mais.length?' · também às '+mais.map(x=>hjH(x.h)+' com '+hjCom(x.p)).join(' e ')+' (uma mensagem só)':''} · não respondeu`,`<button class="btn sec min" onclick="hjLigar(${e.id})">📞 Ligar</button><button class="btn min" onclick="hjConfirmou(${e.id})">Confirmou</button><button class="btn sec min" onclick="hjRemarcarBtn(${e.id})">Quer remarcar</button>`)};
  const linRem=r=>it(r.q,r.pac,`respondeu 2 · o agente ofereceu ${r.of} · a vaga foi para Vagas`,`<button class="btn sec min" onclick="${pode('vagas')?"ir('vagas')":"rxIr('hj-6')"}">Ver a vaga</button>`);
  const cont=(a,b,c)=>`<div class="hj-tags" style="margin:.1rem 0 .35rem"><span class="chip g">✓ ${hjPl(a,'pessoa respondeu','pessoas responderam')} 1</span><span class="chip b">↺ ${hjPl(b,'respondeu','responderam')} 2</span><span class="chip ${c?'a':''}">☎ ${c} sem resposta</span></div>`;
  let c3=cab(3,'Confirmação da véspera',nLigar,'Sai sozinha às 10h, uma mensagem por pessoa com os horários dela do dia seguinte: "Responda 1 para confirmar ou 2 para remarcar". Quem responde 2 recebe outros horários e a vaga vai para Vagas. Quem não responde, a recepção liga.',rxF('ex'));
  c3+=`<div class="hj-sub">Hoje · qua 23/09 · saiu ontem às 10h</div>`+cont(hj1,hj2.length,hjSem.length)+hjSem.map(linLigar).join('')+hj2.map(linRem).join('');
  c3+=`<div class="hj-sub">Amanhã · qui 24/09 · ${HJ_LOTE?'saiu hoje às 10h · respostas até 10h30':'sai hoje às 10h'}</div>`;
  if(!HJ_LOTE) c3+=`<div style="font-size:.84rem">Vão <b>${hjPl(amPes.length,'mensagem','mensagens')}</b>, uma por pessoa, para ${hjPl(amAlvo.length,'atendimento','atendimentos')} de amanhã que ainda não confirmaram${amDuas.length?` (${hjE(amDuas)} ${amDuas.length>1?'têm 2 horários e recebem':'tem 2 horários e recebe'} uma só)`:''}${am1?`; ${hjPl(am1,'pessoa já confirmou','pessoas já confirmaram')}`:''}.</div>
    <div class="mut" style="font-size:.76rem;margin:.2rem 0 .1rem">${amPes.slice(0,8).map(e=>e.h+' '+hjPrim(e.pac)).join(' · ')}${amPes.length>8?' · +'+(amPes.length-8):''}</div>
    <div class="acoes"><button class="btn sec min" onclick="abrirLote()">Ver a mensagem</button><button class="btn min" onclick="hjLote()">Simular as respostas (10h30)</button></div>`;
  else c3+=cont(am1,am2.length,amSem.length)+amSem.map(linLigar).join('')+am2.map(linRem).join('')
    +(amDepois?`<div class="faint" style="font-size:.74rem;margin-top:.3rem">${hjPl(amDepois,'pessoa marcou','pessoas marcaram')} depois das 10h: a confirmação vai na hora de marcar.</div>`:'');
  c3+=`<div class="faint" style="font-size:.74rem;margin-top:.5rem">Sem resposta: o agente manda de novo às 16h; se preferir, ligue antes. No Amigo, em ${AM.lido}, ${AM.confirmadas} de ${AM.consultas} consultas estavam confirmadas. ${rxF('amigo')}</div>`;
  h+=bloco(3,nLigar,c3);

  /* 4 · finalizados sem a resposta que move o funil */
  h+=bloco(4,fins.length,cab(4,'Finalizados sem resposta: "propôs tratamento?"',fins.length,'O Amigo avisa que o atendimento acabou; só a recepção sabe se houve proposta. É essa resposta que faz a consulta virar tratamento no funil.',rxF('ex'))
    +(fins.length?lim(4,fins,4,e=>it(hjQuando(e),e.pac,`${e.tipo} · ${rxNome(e.p)} · ${e.p==='manoel'?'o médico':rxNome(e.p)} propôs tratamento?`,`<button class="btn min" onclick="hjTrat(${e.id},'sim')">Sim, montar proposta</button><button class="btn sec min" onclick="hjTrat(${e.id},'nao')">Não</button>`)):feito('Todos os atendimentos de hoje e de ontem já têm resposta.')));

  /* 5 · "vou ver" que voltaram para a recepção (do funil) */
  h+=bloco(5,vv.length,cab(5,'Disseram "vou ver" e voltaram para você',vv.length,'Depois de "vou ver", o agente não insiste sozinho. Quem chama de novo é a recepção, com a frase do paciente na mão.',rxF('ex'))
    +(vv.length?vv.map(({col,i,c,fr})=>it(col==='Recebeu o preço'?'preço':'proposta',c.n,`${c.s} · "${fr}"`,`<button class="btn min" onclick="abrirVouVer('${col}',${i})">Chamar agora</button>`)).join(''):feito('Ninguém esperando resposta.'))
    +`<div class="faint" style="font-size:.74rem;margin-top:.45rem">No último mês, ${W.preco.receberam-W.preco.marcaram} pessoas pararam depois do preço e ${W.preco.nuncaChamados} nunca foram chamadas de novo. ${rxF('wa')}</div>
    <div class="acoes"><button class="btn sec min" onclick="FU_FASE='venda';ir('funil')">Ver no Funil</button></div>`);

  /* 6 · vagas que abriram (Vagas: o Zaq acha quem cabe; no 1º mês a recepção aprova) */
  h+=bloco(6,vagasOf,cab(6,'Vagas que abriram',vagasOf,'Cancelou, pediu para remarcar ou não pagou o sinal: o Zaq acha quem cabe no horário. No 1º mês, a recepção aprova cada horário antes de a oferta sair; o primeiro que responder 1 fica com ele.',rxF('ex'))
    +(VAGAS.length?VAGAS.map(v=>it(vgQuandoDia(v.dia)+' '+v.h,`${rxNome(v.p)} · ${v.local}`,vgResumoHoje(v),vgBotaoHoje(v))).join(''):feito('Nenhum horário abriu hoje.'))
    +(pode('vagas')?`<div class="acoes"><button class="btn sec min" onclick="VG_ABA='hoje';ir('vagas')">Ver Vagas</button></div>`:''));

  /* 7 · retornos a chamar hoje (dos pedidos no Amigo) */
  const amanhaRet=new Set(RET.amanha.map(([n])=>n));
  h+=bloco(7,nRet,cab(7,'Retornos a chamar hoje',nRet,`O médico pediu a volta e ninguém chamou: no Amigo, ${AM.retornos} retornos pedidos e ${AM.retornosChamados} chamados. Hoje ${RET.vao.length===1?'vai o mais atrasado':'vão os '+RET.vao.length+' mais atrasados'}${RET.amanha.length?' ('+vgNomes(RET.amanha.map(x=>x[0]))+' fica para amanhã: 1 mensagem automática por pessoa por dia)':''}; o resto, nos próximos dias.`,rxF('amigo')+rxF('ex'))
    +HJ_RET.map(([n,d])=>it('há '+d+' dias',n,amanhaRet.has(n)?'retorno vencido · Dr. Manoel · '+hjRetMotivo(n):'retorno vencido · Dr. Manoel',amanhaRet.has(n)?'<span class="chip">amanhã</span>':HJ_RET_OK?'<span class="chip g">chamado</span>':'')).join('')
    +(HJ_RET_OK?feito(`${RET.vao.length} chamados agora (só nesta sessão) · faltam ${AM.retornos-RET.vao.length} para os próximos dias`):'')
    +`<div class="acoes">${HJ_RET_OK||!RET.vao.length?'':`<button class="btn min" onclick="abrirRetornos()">Ver a mensagem e chamar os ${RET.vao.length}</button>`}<button class="btn sec min" onclick="PS_SEG='retorno';ir('pacientes')">Ver os ${AM.retornos}</button></div>`);

  /* 8 · Pix vencendo: sinais (até 18h) e parcelas */
  let c8=cab(8,'Pix vencendo: sinais e parcelas',sinais.length+pix.length,'O sinal de horário reservado vence hoje às 18h; parcela e assinatura vencem no dia. O link de Pix sai sozinho; aqui fica o que ainda não caiu.',rxF('ex'));
  c8+=`<div class="hj-sub">Sinal por Pix · até as 18h de hoje</div>`
    +(sinais.length?sinais.map(e=>it(hjQuando(e),e.pac,`${e.tipo} · ${rxNome(e.p)} · ${localDe(e.p,e.dia)} · sinal R$ 50 · ${e.motivo}`,`<button class="btn sec min" onclick="abrirSinal(${e.id})">Ver</button><button class="btn min" onclick="hjSinal(${e.id},'pago')">Simular: pagou</button><button class="btn sec min" onclick="hjSinal(${e.id},'venceu')">Simular: deu 18h</button>`)).join(''):feito('Nenhum sinal esperando.'));
  if(sinais[0]) c8+=`<div class="zap" style="margin-top:.5rem">${hjMsgSinal(sinais[0])}</div>`;
  c8+=hjRegrasSinal()+`<div class="faint" style="font-size:.74rem;margin-top:.45rem">Quando o agente pede sinal (a clínica decide): dia de viagem e quem já faltou sem avisar. No mercado, o sinal corta cerca de ${RX_MERC.sinalCorta}% das faltas ${rxF('merc')} <span class="faint">referência, não garantia</span></div>`;
  c8+=`<div class="hj-sub">Parcelas e assinaturas</div>`
    +(pix.length?pix.map(([x,i])=>it(`<span class="chip ${x.k}">${x.q}</span>`,x.n,`${x.o} · ${brl(x.v)} · ${x.nota}`,`<button class="btn min" onclick="hjPixMandar(${i})">Mandar Pix</button><button class="btn sec min" onclick="hjPixOk(${i})">Recebi</button>`)).join(''):feito('Nada vencendo hoje.'));
  h+=bloco(8,sinais.length+pix.length,c8);

  h+=`<div class="hint dev">Protótipo: "agora" é qua 23/09, 8h50. Os botões mudam Agenda, Funil e Vagas só nesta sessão, e nenhuma mensagem sai. A confirmação de amanhã sai às 10h; "Simular as respostas" mostra como fica às 10h30.</div>`;
  return h;
}

/* =================================================================
   telas que existem hoje (só para o menu não quebrar)
   ================================================================= */
function telaExistente(n){return `<div class="pg-h"><div><h1>${n}</h1><div class="sub">${APRESENTA?'Esta tela já existe no Zaq e funciona igual para a clínica.':'<span class="dev">Tela que já existe no Zaq e não muda neste projeto.</span>'}</div></div></div>
  <div class="card"><div class="mut">${APRESENTA?'Caixa, produtos, financeiro, empresa, relatórios, equipe e novidades continuam como já são no Zaq.':'<span class="dev">No protótipo, as telas novas estão no menu com a etiqueta <span class="chip g">novo</span>, e as que mudam para clínica com <span class="chip b">muda</span>.</span>'}</div>
  <div class="acoes"><button class="btn" onclick="ir('hoje')">Ir para Hoje</button></div></div>`}
/* ver como recepção: tela do dono mostra este aviso em vez do conteúdo */
function telaSoDono(){const it=itemMenu(ROTA==='paciente'?'pacientes':ROTA);
  return `<div class="pg-h"><div><h1>${it?it[1]:'Esta tela'}</h1><div class="sub">Visível só para o dono.</div></div></div>
  <div class="card"><div class="mut" style="font-size:.86rem;line-height:1.55">Você está vendo como <b style="color:var(--txt)">recepção</b>. Raio-X, Roteiro, configuração e os valores de faturamento da clínica ficam com o dono. A recepção trabalha em Hoje, Conversas, Agenda, Vagas, Pacientes, Funil e Tratamentos, com desconto até 10%.</div>
  <div class="acoes"><button class="btn" onclick="ir('hoje')">Ir para Hoje</button><button class="btn sec" onclick="VER_COMO='dono';trocarPapel()">Ver como dono</button></div></div>`}

function render(){
  const T={hoje:telaHoje,conversas:telaConversas,agenda:telaAgenda,pacientes:telaPacientes,funil:telaFunil,roteiro:telaRoteiro,vagas:telaVagas,paciente:telaPaciente,planos:telaPlanos,raiox:telaRaio,config:telaConfig};
  const nomes={caixa:'Caixa',produtos:'Produtos',financeiro:'Financeiro',empresa:'Empresa',relatorios:'Relatórios',equipe:'Equipe',novidades:'Novidades'};
  const m=$('#main');
  m.innerHTML = !pode(ROTA)?telaSoDono():T[ROTA]?T[ROTA]():telaExistente(nomes[ROTA]||ROTA);
  simplificar(m);
}
if(/apresenta/.test(String(location.hash||'')+String(location.search||'')))APRESENTA=true; // link para a clínica: …#hoje?apresenta abre no modo apresentação
ROTA=rotaDoHash();
gerarSemana();
rtPreparar(); // Roteiro: cirurgia não viaja; o sábado em Lago da Pedra troca só ela por consulta
cfPreparar(); // Configurar: o agente só segura o que ele marca (AG_MARCA), e só na sede
hjPreparar(); // Hoje: confirmação de amanhã ainda não saiu + horários aguardando sinal
agOrigem();   // Agenda: quem marcou cada atendimento (Amigo, agente ou aqui)
menu();render();
</script>
</body></html>
