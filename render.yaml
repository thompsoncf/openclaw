services:
  - type: worker
    name: openclaw-bot
    runtime: python
    plan: standard
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # Aplica migrações pendentes ANTES de subir o código novo (idempotente e
    # serializado por advisory lock). Blindagem: deploy nunca sobe com o banco
    # atrasado. Se a migração falhar, o deploy é abortado e a versão antiga fica.
    preDeployCommand: python -m db.aplicar_migracoes
    startCommand: python telegram_bot.py
    envVars:
      - key: OPENCLAW_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false

  - type: web
    name: openclaw-web
    runtime: python
    plan: standard
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # Mesma blindagem do worker: migrações pendentes rodam antes de servir. O
    # advisory lock impede que web e worker apliquem em paralelo se deployarem juntos.
    preDeployCommand: python -m db.aplicar_migracoes
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: OPENCLAW_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_SECRET
        sync: false
      - key: PORTAL_COOKIE_SECURE
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false
