# =============================================================================
# REFERENCIA DE CONFIG - NAO CONECTE ISTO COMO BLUEPRINT NO RENDER.
# Os servicos no Render sao gerenciados MANUALMENTE e deployam por git (auto-
# deploy na branch main). Os nomes reais la' tem sufixo -bcu3:
#     openclaw-web-bcu3            (este web; webhook Telegram + app.zaq-ia.com)
#     openclaw-monitor-saldos-bcu3 (o cron de saldos)
#     openclaw-cron-diario         (cron a parte)
# O Blueprint foi REMOVIDO de proposito: a cada sync ele RECRIAVA servicos (o
# Render sufixa o nome em colisao -> -bcu3, depois -bcu3-bcu3...), gerando
# duplicados vazios. Este arquivo fica so' como DOCUMENTACAO da config real.
# Se reconectar como Blueprint, ele vai DUPLICAR os servicos de novo.
# =============================================================================
services:
  # Telegram por WEBHOOK (POST /webhook/telegram), junto do WhatsApp e do portal
  # - 1 servico so'. O worker de long polling foi aposentado (telegram_bot.py
  # segue disponivel pra dev local via run_polling).
  - type: web
    name: openclaw-web
    runtime: python
    plan: standard
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # Mesma blindagem do worker: migrações pendentes rodam antes de servir. O
    # advisory lock impede que web e worker apliquem em paralelo se deployarem juntos.
    preDeployCommand: python -m db.aplicar_migracoes
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: OPENCLAW_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_SECRET
        sync: false
      - key: PORTAL_COOKIE_SECURE
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false
      # --- Alertas do admin (provedor pago quebrado) ---
      # O web tambem avisa o admin: core.falhas chama avisar_admin_falha_provedor
      # quando um provedor pago falha de forma acionavel (chave do Asaas expirou,
      # Twilio sem saldo, quota da IA estourada). Sem SMTP_* aqui NAO sai e-mail
      # nenhum desses avisos.
      # ADMIN_EMAIL/ADMIN_TELEGRAM_ID viraram FALLBACK: o destino oficial agora se
      # configura em /admin/comunicacao (tabela app_config), que ganha do env e
      # vale pros tres servicos de uma vez, sem redeploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_SENHA
        sync: false
      # --- Telegram por webhook (unifica os servidores; aposenta o worker) ---
      # TELEGRAM_TOKEN: o MESMO token do bot. Com ele setado aqui, o web ja'
      #   consegue processar updates do Telegram na rota /webhook/telegram.
      # TELEGRAM_WEBHOOK_SECRET: string aleatoria; valida que o update veio mesmo
      #   do Telegram (header X-Telegram-Bot-Api-Secret-Token).
      # TELEGRAM_WEBHOOK_URL: a URL do webhook, ja' ATIVA em producao. Ex:
      #   https://openclaw-web-bcu3.onrender.com/webhook/telegram
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      # --- WhatsApp por QR Code (serviço Node à parte, services/wa-qr) ---
      # WA_QR_SERVICE_URL: URL pública do serviço wa-qr (ex.:
      #   https://openclaw-waqr.onrender.com). Sem ela, a via QR fica inerte.
      # WA_QR_SHARED_SECRET: MESMO segredo dos dois lados (autentica web<->wa-qr).
      - key: WA_QR_SERVICE_URL
        sync: false
      - key: WA_QR_SHARED_SECRET
        sync: false
      # --- Observabilidade de deploy (POST /webhook/render) ---
      # SO' AQUI. Os crons e o wa-qr nao servem essa rota; por' la' nao fariam
      # nada alem de espalhar segredo.
      # O webhook em si NAO e' deste servico: no Render ele e' do WORKSPACE
      # (dashboard.render.com/webhooks) e so' aponta pra URL daqui —
      # https://openclaw-web-bcu3.onrender.com/webhook/render
      # RENDER_WEBHOOK_SECRET: assinatura do webhook (whsec_...). SEM ela a rota
      #   fica INERTE: responde 200 e ignora, sem gravar nada. E' o que permite
      #   subir o codigo antes de criar o webhook la'.
      # RENDER_API_KEY: Account Settings -> API Keys (rnd_...). Enriquece o
      #   evento com nome do servico, status legivel, commit e cauda do log.
      #   Sem ela o evento e' gravado cru, e `sucesso` fica NULL em vez de
      #   false — nao alerta por chute.
      # Passo-a-passo: docs/RENDER_OBSERVABILIDADE.md
      - key: RENDER_WEBHOOK_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false

  # WhatsApp por QR Code (tipo WhatsApp Web / Baileys). Serviço Node SEMPRE
  # ligado, 1 instância (a sessão é stateful em memória — NÃO escale horizontal).
  # Estado da sessão fica no Postgres (tabela wa_qr_auth, migração 097). Só suba
  # este serviço quando um cliente exigir o QR e aceitar o risco de ban.
  #
  # numInstances:1 não bastava: o deploy sem downtime sobe a instância nova ANTES
  # de matar a velha, e por alguns segundos existem duas com a mesma credencial —
  # que é o que o WhatsApp responde com 440 (connectionReplaced), derrubando as
  # sessões a cada deploy. Quem garante uma só agora é a trava de sessão por
  # conta (tabela wa_qr_sessao_lock, migração 157, ver services/wa-qr/README.md):
  # a instância nova espera a velha soltar no SIGTERM em vez de roubar a sessão.
  #   Root Directory: services/wa-qr · Build: npm install · Start: npm start
  #   Health check path: /saude
  - type: web
    name: openclaw-waqr
    runtime: node
    plan: standard
    numInstances: 1
    rootDir: services/wa-qr
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WA_QR_SHARED_SECRET
        sync: false
      # APP_URL = URL pública do web (pra onde as mensagens recebidas são repassadas)
      - key: APP_URL
        sync: false

  # Monitor PROATIVO de saldo/gasto dos provedores pagos (avisa o admin ANTES
  # de acabar). Roda 1x/dia. Cada checagem so' age se o limiar estiver setado:
  #   ANTHROPIC_GASTO_DIA_MAX_USD  -> alerta de gasto diario anomalo da IA
  #   TWILIO_SALDO_MIN_USD         -> alerta de saldo baixo do WhatsApp
  #   ASAAS_SALDO_MIN              -> alerta de saldo baixo do Asaas
  # Precisa de SMTP_* (e-mail) e do destino do alerta, que sai de
  # /admin/comunicacao (banco) ou, como fallback, das envs ADMIN_EMAIL /
  # ADMIN_TELEGRAM_ID daqui.
  - type: cron
    # No Render, este cron e' o "openclaw-monitor-saldos-bcu3" (gerenciado manual).
    name: openclaw-monitor-saldos
    runtime: python
    plan: standard
    schedule: "0 12 * * *"   # 12:00 UTC (~09:00 BRT) todo dia
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.monitor_saldos
    envVars:
      - key: ANTHROPIC_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_GASTO_DIA_MAX_USD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SALDO_MIN_USD
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_AMBIENTE
        sync: false
      - key: ASAAS_SALDO_MIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_SENHA
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
