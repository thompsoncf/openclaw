services:
  - type: worker
    name: openclaw-bot
    runtime: python
    plan: standard
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # Aplica migrações pendentes ANTES de subir o código novo (idempotente e
    # serializado por advisory lock). Blindagem: deploy nunca sobe com o banco
    # atrasado. Se a migração falhar, o deploy é abortado e a versão antiga fica.
    preDeployCommand: python -m db.aplicar_migracoes
    startCommand: python telegram_bot.py
    envVars:
      - key: OPENCLAW_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false

  - type: web
    name: openclaw-web
    runtime: python
    plan: standard
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # Mesma blindagem do worker: migrações pendentes rodam antes de servir. O
    # advisory lock impede que web e worker apliquem em paralelo se deployarem juntos.
    preDeployCommand: python -m db.aplicar_migracoes
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: OPENCLAW_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_SECRET
        sync: false
      - key: PORTAL_COOKIE_SECURE
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false
      - key: STT_MODEL
        sync: false
      # --- Telegram por webhook (unifica os servidores; aposenta o worker) ---
      # TELEGRAM_TOKEN: o MESMO token do bot. Com ele setado aqui, o web ja'
      #   consegue processar updates do Telegram na rota /webhook/telegram.
      # TELEGRAM_WEBHOOK_SECRET: string aleatoria; valida que o update veio mesmo
      #   do Telegram (header X-Telegram-Bot-Api-Secret-Token).
      # TELEGRAM_WEBHOOK_URL: o INTERRUPTOR. Ex: https://<web>.onrender.com/webhook/telegram
      #   So' quando setar isto o Telegram passa a entregar AQUI (e o worker de
      #   polling para de receber). Deixe VAZIO ate' terminar o teste.
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false

  # Monitor PROATIVO de saldo/gasto dos provedores pagos (avisa o admin ANTES
  # de acabar). Roda 1x/dia. Cada checagem so' age se o limiar estiver setado:
  #   ANTHROPIC_GASTO_DIA_MAX_USD  -> alerta de gasto diario anomalo da IA
  #   TWILIO_SALDO_MIN_USD         -> alerta de saldo baixo do WhatsApp
  #   ASAAS_SALDO_MIN              -> alerta de saldo baixo do Asaas
  # Precisa de ADMIN_EMAIL + SMTP_* (e-mail) e/ou ADMIN_TELEGRAM_ID (Telegram).
  - type: cron
    name: openclaw-monitor-saldos
    runtime: python
    plan: standard
    schedule: "0 12 * * *"   # 12:00 UTC (~09:00 BRT) todo dia
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.monitor_saldos
    envVars:
      - key: ANTHROPIC_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_GASTO_DIA_MAX_USD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SALDO_MIN_USD
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_AMBIENTE
        sync: false
      - key: ASAAS_SALDO_MIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_SENHA
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
