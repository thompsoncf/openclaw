name: CI

# Roda a suíte a cada push na main e em todo pull request.
# Sobe um Postgres 16 DESCARTÁVEL como service e aponta TEST_DATABASE_URL pra ele.
# Nunca toca produção: DATABASE_URL não é definida aqui, e a trava em
# tests/conftest.py já exige um banco de teste separado.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Postgres 16)
    runs-on: ubuntu-latest
    # TETO DO JOB. Sem isto o padrão é SEIS HORAS, e em 03/09/2026 um run ficou
    # pendurado no passo do pytest — 35 minutos contra os 3~4 de sempre — sem
    # nenhum sinal de vida: os logs não saem enquanto o job corre, então "travado"
    # e "lento" ficam indistinguíveis justamente na hora em que a diferença
    # importa. Vinte minutos é cinco vezes a duração normal: quem passar disso
    # está travado, não lento.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Roda a suíte
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openclaw_test
        # `tee` pra saída aparecer no log DO PASSO e também virar arquivo. O `-o
        # pipefail` é o que faz o passo continuar falhando quando o pytest falha:
        # sem ele quem decide o código de saída é o `tee`, que sempre dá zero — e
        # o CI passaria a mentir "verde" com teste quebrado, que é bem pior do que
        # o problema que este bloco veio resolver.
        #
        # `--timeout` pelo MESMO motivo, um degrau acima: teste que trava não
        # falha, e o que não falha não passa pelas anotações logo abaixo — o job
        # só morre no teto do runner, horas depois, sem dizer nada. Com o teto por
        # teste, travar vira FAILED com traceback do ponto exato, e a máquina de
        # diagnóstico que já existe aqui passa a valer também pra esse caso.
        # 120s é folgado: o teste mais lento da suíte não chega a 10s, e a suíte
        # inteira roda em ~3min.
        run: |
          set -o pipefail
          pytest -q -rf --tb=short --color=no \
                 --timeout=120 --timeout-method=thread 2>&1 | tee pytest-saida.txt

      # POR QUE ISTO EXISTE. Em 26/08 o CI reprovou três vezes seguidas e não houve
      # jeito de saber QUAL teste caiu: a API de logs devolve o log do contêiner do
      # Postgres (milhares de linhas de checkpoint) e as anotações do check run
      # trazem só "Process completed with exit code 1". Cada tentativa de conserto
      # virou palpite, e cada palpite custou um ciclo inteiro de CI.
      #
      # `if: always()` porque o valor está justamente na execução que FALHOU — só
      # no sucesso seria inútil.
      - name: Publica a saída do pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-saida
          path: pytest-saida.txt
          retention-days: 14
          if-no-files-found: warn

      # O resumo do job aparece na PRÓPRIA página do run, sem baixar nada — é o
      # caminho mais curto entre "ficou vermelho" e "foi este teste".
      # ANOTAÇÕES, e não só o resumo. O resumo aparece na página do run pra quem
      # abre o navegador; a anotação vem pela API REST (/check-runs/{id}/annotations),
      # que é o único canal que se mostrou legível de fora — a API de logs devolve o
      # log do contêiner do Postgres, e o download de artefato é bloqueado por proxy.
      # Sem isto, "ficou vermelho" não chega a virar "foi este teste".
      - name: Falhas como anotação
        if: failure()
        run: |
          echo "::error title=Resumo::$(tail -1 pytest-saida.txt | tr -d '\r')"
          grep -E '^(FAILED|ERROR)' pytest-saida.txt | head -40 | while read -r l; do
            echo "::error title=Teste::${l}"
          done || true
          # a suíte pode morrer ANTES de qualquer linha FAILED (erro de coleta,
          # processo derrubado). Aí o que importa é o rabo da saída, não a ausência.
          if ! grep -qE '^(FAILED|ERROR)' pytest-saida.txt; then
            tail -12 pytest-saida.txt | while read -r l; do
              echo "::error title=Fim da saida::${l}"
            done
          fi

      - name: Resumo na página do run
        if: failure()
        run: |
          echo '## Testes que falharam' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^(FAILED|ERROR)' pytest-saida.txt >> $GITHUB_STEP_SUMMARY || \
            echo '(nenhuma linha FAILED/ERROR — a suíte pode ter morrido antes de rodar)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Últimas 120 linhas</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 pytest-saida.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
